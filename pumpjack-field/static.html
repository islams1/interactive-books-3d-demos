<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PJ-320 Oil Field</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1ede6; --panel:rgba(251,249,245,.9); --line:#e3dcd1; --ink:#1b1c1f; --mute:#8d867b;
  --acc:#ff5a1f; --ok:#27a36a; --col:258px; --gut:14px;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace; --sans:'Space Grotesk',system-ui,sans-serif; --ar:'IBM Plex Sans Arabic',system-ui,sans-serif;
}
body.ar{--mono:'IBM Plex Sans Arabic',system-ui,sans-serif; --sans:'IBM Plex Sans Arabic',system-ui,sans-serif}
body.ar *{letter-spacing:0 !important}
body.ar #crosses{letter-spacing:14px !important;direction:ltr}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--mono);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#scene.hover{cursor:pointer}
#scene:active{cursor:grabbing}

/* ---------- header ---------- */
header{position:fixed;top:0;left:0;right:0;height:72px;display:flex;z-index:6;pointer-events:none}
.logo{width:132px;background:var(--acc);color:#fff;display:flex;align-items:center;gap:10px;padding:0 16px;pointer-events:auto}
.logo svg{width:30px;height:30px;flex:none}
.logo b{font:700 11px 'JetBrains Mono',monospace;letter-spacing:.2em}
.title{padding:12px 18px 0}
.title .k{display:block;margin-bottom:3px}
.title h1{font:700 26px/1 var(--sans);letter-spacing:-.02em;white-space:nowrap}
.title h1 .sl{color:var(--acc);font-weight:500}
.title .subt{margin-top:6px;font-size:9px;letter-spacing:.28em;color:#58534c}
body.ar .title .subt{font-size:11px}
.metrics{margin-left:auto;display:flex;padding:16px 6px 0 0;pointer-events:auto}
.metric{padding:0 14px;border-left:1px solid var(--line);min-width:88px}
.metric:first-child{border-left:0}
.metric .v{font-size:11px;letter-spacing:.08em;margin-top:6px;white-space:nowrap}
.metric .v .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--acc);margin-inline-end:7px;vertical-align:1px;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
.gload{width:240px;padding-right:16px;border-left:0}
.gload .top{display:flex;justify-content:space-between}
.segs{display:flex;gap:2px;margin:5px 0 4px;height:9px;direction:ltr}
.segs i{flex:1;background:#e4ddd2;border-radius:1px}
.segs i.on{background:var(--ink)}
.segs i.hot{background:var(--acc)}
.hbtns{display:flex;gap:6px;padding:16px 14px 0 8px;pointer-events:auto;align-items:flex-start}
.drawer{display:none}
.lang{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:#fff}
.lang button{font:600 9.5px 'JetBrains Mono',monospace;padding:6px 9px;letter-spacing:.1em;color:var(--mute)}
.lang button[data-lang=ar]{font:600 11px 'IBM Plex Sans Arabic',sans-serif;padding:4px 9px}
.lang button.on{background:var(--ink);color:#fff}

/* ---------- shared ---------- */
.k{font-size:8px;letter-spacing:.2em;color:var(--mute);text-transform:uppercase}
body.ar .k{font-size:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:10px 12px 11px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);pointer-events:auto}
body.ar .panel,body.ar .title,body.ar .metric,body.ar .hud,body.ar .lbl,body.ar #footer span{direction:rtl}
.ph{display:flex;justify-content:space-between;align-items:center;font-size:9.5px;letter-spacing:.2em;font-weight:700;margin-bottom:8px}
body.ar .ph{font-size:11.5px}
.ph b::before{content:'';display:inline-block;width:3px;height:10px;background:var(--acc);margin-inline-end:8px;vertical-align:-1px}
.ph i{font-style:normal;color:var(--mute);font-weight:400;font-size:8.5px;letter-spacing:.12em}
body.ar .ph i{font-size:10px}
.big{font:700 28px/1 var(--sans);letter-spacing:-.03em;white-space:nowrap}
.big.sm{font-size:21px}
.big small{font:500 10.5px var(--sans);color:var(--mute);margin-inline-start:3px;letter-spacing:0}
.row{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.ta-end{text-align:end}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.grid3 .v{font-size:11px;margin-top:4px;letter-spacing:.03em;white-space:nowrap}
canvas.mini{display:block;width:100%;height:44px;margin-top:6px}
canvas.dyno{display:block;width:100%;height:84px;margin-top:2px}
.chip{font:600 8.5px var(--mono);letter-spacing:.14em;padding:5px 7px;border:1px solid var(--line);background:#fff;border-radius:3px;text-transform:uppercase;transition:background .15s,color .15s,border-color .15s}
body.ar .chip{font-size:11px;padding:3px 8px}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.chip:disabled{opacity:.35;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.pill{font:700 7.5px var(--mono);letter-spacing:.12em;padding:2px 5px;border-radius:2px;color:#fff;background:var(--ok);white-space:nowrap}
body.ar .pill{font-size:9.5px;font-weight:600;padding:1px 6px}
.pill.idle{background:#ddd6cb;color:#6b655c}
.pill.acc{background:var(--acc)}

/* ---------- side columns ---------- */
#left,#right{position:fixed;top:84px;bottom:var(--gut);width:var(--col);display:flex;flex-direction:column;gap:8px;overflow-y:auto;scrollbar-width:none;z-index:5;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#left::-webkit-scrollbar,#right::-webkit-scrollbar{display:none}
#left{left:var(--gut)} #right{right:var(--gut)}
.bars{display:flex;gap:3px;height:16px;direction:ltr}
.bars i{width:8px;background:#e4ddd2;border-radius:1px}
.bars i.on{background:var(--ok)}
.bars i.hot{background:var(--acc)}
.slider{margin-top:8px}
.slider .row{align-items:center}
.slider .v{font-size:10.5px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;margin-top:2px;direction:ltr}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(to right,var(--acc) var(--p,50%),#ddd5c9 var(--p,50%))}
input[type=range]::-moz-range-track{height:2px;background:#ddd5c9}
input[type=range]::-moz-range-progress{height:2px;background:var(--acc)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--acc);margin-top:-5px}
input[type=range]::-moz-range-thumb{width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid var(--acc)}
.btnrow{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}

/* inspector */
.insp-no{font:700 9.5px var(--mono);color:var(--acc);letter-spacing:.18em}
.insp-name{font:700 18px/1.15 var(--sans);letter-spacing:-.02em;margin-top:3px}
.insp-sub{font-size:8.5px;letter-spacing:.14em;color:var(--mute);margin-top:5px}
body.ar .insp-sub{font-size:10.5px}
.insp-desc{font:400 11.5px/1.65 'Space Grotesk',sans-serif;color:#3c3934;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
body.ar .insp-desc{font:400 12.5px/1.75 var(--ar)}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.specs .v{font-size:10.5px;margin-top:3px;letter-spacing:.02em}
body.ar .specs .v{font-size:11.5px}

/* subsystems */
.subs{list-style:none}
.subs li{display:grid;grid-template-columns:20px 1fr auto;gap:4px;align-items:center;padding:4px 4px 4px 3px;border-inline-start:2px solid transparent;cursor:pointer;border-radius:2px}
.subs li:hover{background:rgba(0,0,0,.03)}
.subs li.on{border-inline-start-color:var(--acc);background:rgba(255,90,31,.06)}
.subs li.on .n{color:var(--acc)}
.subs .no{font-size:8.5px;color:var(--mute)}
.subs .n{font-size:9.5px;letter-spacing:.13em;font-weight:700}
.subs .d{font-size:7.5px;letter-spacing:.1em;color:var(--mute);margin-top:1px}
body.ar .subs .n{font-size:11.5px;font-weight:600}
body.ar .subs .d{font-size:9.5px}

/* ---------- bottom ---------- */
#bottom{position:fixed;left:calc(var(--col) + var(--gut) * 2);right:calc(var(--col) + var(--gut) * 2);bottom:var(--gut);z-index:5;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.dock{padding-bottom:9px}
.docklist{display:flex;flex-wrap:wrap;gap:4px}
.dchip{display:flex;align-items:center;gap:6px;font:600 8.5px var(--mono);letter-spacing:.12em;padding:5px 7px 5px 6px;background:#fff;border:1px solid var(--line);border-radius:3px;transition:all .15s}
body.ar .dchip{font-size:11px;padding:3px 8px 3px 7px}
.dchip em{font:normal 7.5px 'JetBrains Mono',monospace;color:var(--mute);letter-spacing:.04em}
.dchip:hover{border-color:var(--ink)}
.dchip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.dchip.on em{color:#ffd9c9}
.oplog .ph{margin-bottom:4px}
.opl{display:flex;align-items:center;gap:14px}
.playbtn{width:36px;height:36px;border-radius:50%;background:var(--acc);display:grid;place-items:center;flex:none;box-shadow:0 3px 10px rgba(255,90,31,.3)}
.playbtn svg{width:12px;height:12px;fill:#fff}
.opl-main{flex:1;min-width:0}
.opl-top,.opl-bot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.opact{font-size:9px;letter-spacing:.18em;color:var(--acc);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.ar .opact{font-size:11.5px}
.track{position:relative;height:20px;margin:2px 0;cursor:pointer;direction:ltr}
.track::before{content:'';position:absolute;left:0;right:0;top:9px;height:2px;background:#e1d9cd}
.track .fill{position:absolute;left:0;top:9px;height:2px;background:var(--acc);width:0}
.track .tick{position:absolute;top:4px;width:1px;height:12px;background:#a9a196}
.track .tick:hover::after{content:attr(data-l);position:absolute;bottom:16px;left:50%;transform:translateX(-50%);white-space:nowrap;font:9px var(--mono);background:var(--ink);color:#fff;padding:4px 6px;border-radius:2px}
.track .knob{position:absolute;top:3px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#fff;border:2px solid var(--acc)}
.opl-bot span{font-size:9px;letter-spacing:.1em;color:var(--mute)}
body.ar .opl-bot span{font-size:10.5px}

/* ---------- center HUD ---------- */
.hud{position:fixed;z-index:3;pointer-events:none}
#hudTL{top:96px;left:calc(var(--col) + var(--gut) * 2 + 10px)}
#hudTR{top:96px;right:calc(var(--col) + var(--gut) * 2 + 10px)}
#hudMode{left:calc(var(--col) + var(--gut) * 2 + 10px);bottom:226px}
#hudMode .k{display:block}
#modeName{font:700 32px/1.1 var(--sans);color:var(--acc);letter-spacing:-.02em;margin:4px 0 6px}
#crosses{top:74px;left:50%;transform:translateX(-50%);color:var(--acc);font-size:11px;letter-spacing:14px;opacity:.7;white-space:nowrap}
#footer{position:fixed;bottom:2px;left:20px;right:20px;display:flex;justify-content:space-between;font-size:8px;letter-spacing:.22em;color:var(--mute);z-index:2;pointer-events:none}
body.ar #footer{font-size:9.5px}
#footer b{color:var(--acc);font-weight:400}

/* labels */
#leaders{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
#labels{position:fixed;inset:0;pointer-events:none;z-index:3}
.lbl{position:absolute;left:0;top:0;padding:3px 5px;white-space:nowrap;pointer-events:auto;cursor:pointer;will-change:transform;background:rgba(251,249,245,.75);border-radius:2px}
.lbl b{display:block;font-size:9.5px;letter-spacing:.16em;font-weight:700}
.lbl b::before{content:'';display:inline-block;width:6px;height:6px;background:var(--acc);margin-inline-end:7px;vertical-align:1px}
.lbl span{display:block;font-size:7.5px;letter-spacing:.14em;color:var(--mute);margin-top:2px;margin-inline-start:13px}
body.ar .lbl b{font-size:11.5px;font-weight:600}
body.ar .lbl span{font-size:9.5px}
#tip{position:fixed;z-index:8;pointer-events:none;background:var(--ink);color:#fff;font-size:9.5px;letter-spacing:.14em;padding:5px 8px;border-radius:2px;opacity:0;transition:opacity .12s;white-space:nowrap}
body.ar #tip{font-size:11.5px}
#tip i{font-style:normal;color:var(--acc);margin-inline-start:8px}

/* loader */
#loader{position:fixed;inset:0;background:var(--bg);z-index:20;display:grid;place-items:center;transition:opacity .8s}
#loader div{text-align:center}
#loader b{display:block;font:700 26px 'Space Grotesk',sans-serif;letter-spacing:-.02em}
#loader .bar{width:200px;height:2px;background:#e1d9cd;margin:14px auto 0;overflow:hidden}
#loader .bar i{display:block;height:100%;width:40%;background:var(--acc);animation:load 1s infinite ease-in-out}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}

/* ---------- view-only mode: cards slide away while the user works in 3D ---------- */
#bottom{transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .3s}
#left,#right{transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .3s}
.hud{transition:opacity .3s}
body.immersive #left{transform:translateX(calc(-100% - 30px));opacity:0;pointer-events:none}
body.immersive #right{transform:translateX(calc(100% + 30px));opacity:0;pointer-events:none}
body.immersive #bottom{transform:translateY(calc(100% + 30px));opacity:0;pointer-events:none}
body.immersive #hudMode,body.immersive #hudTL,body.immersive #hudTR{opacity:0}
.showui{position:fixed;left:50%;bottom:18px;z-index:7;transform:translate(-50%,90px);opacity:0;pointer-events:none;transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .3s;
  font:600 9.5px var(--mono);letter-spacing:.18em;padding:9px 14px;background:var(--ink);color:#fff;border-radius:20px;box-shadow:0 4px 16px rgba(0,0,0,.18)}
body.ar .showui{font-size:12px;padding:7px 16px}
body.immersive .showui{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.showui:hover{background:var(--acc)}

/* ---------- responsive ---------- */
@media (max-width:1440px){ .gload{width:170px} .metric{min-width:76px;padding:0 10px} }
@media (max-width:1180px){
  .metrics{display:none}
  .hbtns{margin-left:auto}
  .drawer{display:block}
  body:not(.show-left) #left{transform:translateX(calc(-100% - 30px))}
  body:not(.show-right) #right{transform:translateX(calc(100% + 30px))}
  #bottom{left:var(--gut);right:var(--gut)}
  #hudTL,#hudMode{left:20px} #hudTR{right:20px}
}
@media (max-width:700px){
  header{height:56px}
  .logo{width:auto;padding:0 12px}
  .logo svg{width:26px;height:26px}
  .logo b{display:none}
  .title{padding:9px 10px 0}
  .title .k,.title .subt{display:none}
  .title h1{font-size:18px}
  .hbtns{padding:12px 8px 0 0;gap:4px}
  #left,#right{top:64px;bottom:auto;max-height:calc(100% - 250px);left:8px;right:8px;width:auto}
  #bottom{left:8px;right:8px;bottom:8px;gap:6px}
  .dock .ph,.oplog .ph{display:none}
  .docklist{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .dchip{flex:none}
  .panel{padding:8px 10px}
  #hudTL,#hudTR,#crosses,#footer{display:none}
  #hudMode{bottom:160px;left:12px}
  #modeName{font-size:24px}
}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
}}
</script>
</head>
<body>
<canvas id="scene" tabindex="0" aria-label="3D pumpjack model"></canvas>
<svg id="leaders"></svg>
<div id="labels"></div>
<div id="tip"></div>

<header>
  <div class="logo">
    <svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 15 L34 11"/><path d="M34 6 q8 5 4 15"/><path d="M38 21 v17"/><path d="M20 13 L14 42 M20 13 L26 42"/><path d="M8 15 L10 32"/><circle cx="10" cy="34" r="4"/><path d="M4 42 h40"/>
    </svg>
    <b>PJ-320</b>
  </div>
  <div class="title">
    <span class="k" data-i18n="kicker"></span>
    <h1><span data-i18n="title"></span> <span class="sl">/</span></h1>
    <div class="subt" data-i18n="subt"></div>
  </div>
  <div class="metrics">
    <div class="metric gload">
      <div class="top"><span class="k" data-i18n="gload"></span><span class="k" id="hGpct" style="color:var(--ink)">0%</span></div>
      <div class="segs" id="gsegs"></div>
      <div class="top"><span class="k" data-i18n="idle"></span><span class="k" data-i18n="rated"></span><span class="k" data-i18n="peak"></span></div>
    </div>
    <div class="metric"><span class="k" data-i18n="unitid"></span><div class="v">PJ320-0417</div></div>
    <div class="metric"><span class="k" data-i18n="runtime"></span><div class="v" id="hRuntime">00:00:00</div></div>
    <div class="metric"><span class="k" data-i18n="status"></span><div class="v"><span class="dot"></span><span id="hStatus"></span></div></div>
    <div class="metric"><span class="k" data-i18n="field"></span><div class="v" data-i18n="fieldv"></div></div>
  </div>
  <div class="hbtns">
    <button class="chip drawer" id="tglLeft" data-i18n="data"></button>
    <button class="chip drawer" id="tglRight" data-i18n="parts"></button>
    <div class="lang" role="group" aria-label="Language"><button data-lang="en">EN</button><button data-lang="ar">عربي</button></div>
  </div>
</header>

<div id="crosses" class="hud">+ + + + + + + + + + + + + +</div>
<div id="hudTL" class="hud k" data-i18n="model"></div>
<div id="hudTR" class="hud k"><span data-i18n="isolate"></span> · <span id="isoTxt"></span></div>
<div id="hudMode" class="hud">
  <span class="k" data-i18n="opmode"></span>
  <div id="modeName"></div>
  <span class="k" id="modeSub"></span>
</div>

<!-- LEFT: live data -->
<aside id="left">
  <section class="panel">
    <div class="ph"><b data-i18n="p_stroke"></b><i>01</i></div>
    <div class="row">
      <div><div class="big" id="vSpm"></div><div class="k" style="margin-top:5px" data-i18n="spm_l"></div></div>
      <div class="ta-end"><div class="big sm" id="vStroke"></div><div class="k" style="margin-top:5px" data-i18n="len_l"></div></div>
    </div>
    <canvas class="mini" id="spark"></canvas>
    <div class="grid3">
      <div><span class="k" data-i18n="count"></span><div class="v" id="vStrokes">0</div></div>
      <div><span class="k" data-i18n="dir"></span><div class="v" id="vDir">—</div></div>
      <div><span class="k" data-i18n="vel"></span><div class="v" id="vVel">0</div></div>
    </div>
  </section>
  <section class="panel">
    <div class="ph"><b data-i18n="p_dyno"></b><i>02</i></div>
    <div class="row"><span class="k" data-i18n="load"></span><span class="k" data-i18n="pos"></span></div>
    <canvas class="dyno" id="dyno"></canvas>
    <div class="grid3">
      <div><span class="k" data-i18n="pprl"></span><div class="v" id="vPprl">0</div></div>
      <div><span class="k" data-i18n="mprl"></span><div class="v" id="vMprl">0</div></div>
      <div><span class="k" data-i18n="fill"></span><div class="v">92 %</div></div>
    </div>
  </section>
  <section class="panel">
    <div class="ph"><b data-i18n="p_power"></b><i>03</i></div>
    <div class="row">
      <div><div class="big" id="vKw">0</div><div class="k" style="margin-top:5px" data-i18n="shaft"></div></div>
      <div class="bars" id="pbars"></div>
    </div>
    <div class="grid3">
      <div><span class="k" data-i18n="draw"></span><div class="v" id="vAmps">0</div></div>
      <div><span class="k" data-i18n="motor"></span><div class="v" id="vRpm">0</div></div>
      <div><span class="k" data-i18n="torque"></span><div class="v" id="vTorque">0</div></div>

function gearGeo(teeth, r, depth, bore = .06) {
  const pitch = TAU * r / teeth, tip = r + pitch * .3, root = r - pitch * .36, s = TAU / teeth;

    d.scale.setScalar(scale);

function hull(points) {
  points.sort((a, b) => a.x - b.x || a.y - b.y);
  const cr = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
  const lo = [], up = [];
  for (const p of points) { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
  for (let i = points.length - 1; i >= 0; i--) { const p = points[i]; while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
  up.pop(); lo.pop();
  return lo.concat(up);
}

function buildSamson(p) {
  const r = p.root, w = p.m('paint'), d = p.m('dark'), o = p.m('orange');
  const legs = [[[1.35, .42, -1.2], [.3, 5.56, -.42]], [[1.35, .42, 1.2], [.3, 5.56, .42]], [[-2.3, .42, 0], [-.3, 5.56, 0]]];
  legs.forEach(([a, b]) => strut(a, b, .2, .2, w, r));
  const L3 = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
  for (const t of [.3, .62]) {
    const A = L3(...legs[0], t), B = L3(...legs[1], t), R = L3(...legs[2], t);
    strut(A, B, .1, .1, w, r);
    strut(A, R, .08, .08, d, r);
    strut(B, R, .08, .08, d, r);
  }
  strut(L3(...legs[0], .04), L3(...legs[1], .3), .06, .06, d, r);
  strut(L3(...legs[1], .04), L3(...legs[0], .3), .06, .06, d, r);
  mk(box(1.0, .08, 1.1), d, r, [0, 5.6, 0]);
  // saddle bearing (separate teardown piece)
  const saddle = new THREE.Group(); r.add(saddle); p.addSub(saddle, [0, 1.2, 0]);
  for (const z of [-.42, .42]) {
    mk(rbox(.5, .32, .2, .03), o, saddle, [0, 5.8, z]);

  mk(cylZ(.09, 1.12), p.m('steel'), saddle, [0, 6, 0]);
  // platform + railing
  mk(box(1.4, .05, 1.4), d, r, [0, 5.15, 0]);
  for (const x of [-.68, .68]) for (const z of [-.68, .68]) mk(cyl(.025, .025, .7, 8), w, r, [x, 5.5, z]);
  for (const z of [-.68, .68]) mk(box(1.38, .04, .04), o, r, [0, 5.85, z]);
  for (const x of [-.68, .68]) mk(box(.04, .04, 1.38), o, r, [x, 5.85, 0]);
  // ladder along rear leg
  const a = [-2.15, .42], b = [-.55, 5.15];
  for (const z of [.2, .5]) strut([a[0], a[1], z], [b[0], b[1], z], .04, .04, d, r);
  const n = 16;
  for (let i = 1; i < n; i++) {
    const t = i / n;
    mk(cylZ(.016, .3, 6), w, r, [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, .35]);

  p.callout(saddle, [0, 6, .55], 'SADDLE BEARING', 'Ø 180 mm · spherical roller');
  p.callout(r, [0, 5.15, .7], 'SERVICE DECK', 'grating · toe-board rail');

  p.callout(r, [.9, 2.5, -.95], 'FRONT LEGS', 'A-frame · 200 × 200 tube');
}

function buildHorsehead(p) {
  const pv = new THREE.Group(); pv.position.set(P.x, P.y, 0); p.root.add(pv); p.pivot = pv;

  mk(cylZ(.07, .54), d, pv, [3.22, .95, 0]);
  mk(cylZ(.07, .54), d, pv, [3.22, .15, 0]);

function buildMotor(p) {

  for (const x of [-.32, .32]) for (const z of [-.38, .38]) mk(box(.16, .14, .2), Hd, g, [x, -.47, z]);

  for (const rr of [.12, .24, .36]) mk(new THREE.TorusGeometry(rr, .01, 6, 40), p.m('dark'), cowl, [0, 0, -1.0]);
  for (let i = 0; i < 6; i++) mk(box(.012, .9, .012), p.m('dark'), cowl, [0, 0, -1.0], [0, 0, i / 6 * Math.PI]);
  // stator + windings (sectioned with housing)

function buildBelts(p) {
  const r = p.root, st = p.m('steel'), d = p.m('dark');
  const ms = new THREE.Group(); ms.position.set(MOTOR.x, MOTOR.y, BELTZ); r.add(ms); p.ms = ms; ms.userData.spin = true;
  mk(cylZ(.16, .24, 32), st, ms);
  mk(cylZ(.07, .3, 16), d, ms);
  mk(box(.04, .03, .3), p.m('orange'), ms, [0, .07, 0]);
  const is = new THREE.Group(); is.position.set(JW.x, JW.y, BELTZ); r.add(is); p.is = is; is.userData.spin = true;
  mk(tubeZ(.42, .35, .24, 64), st, is);
  mk(cylZ(.09, .3, 20), d, is);
  for (let i = 0; i < 5; i++) { const a = i / 5 * TAU; mk(box(.06, .27, .07), p.m('paint'), is, [Math.cos(a) * .215, Math.sin(a) * .215, 0], [0, 0, a - Math.PI / 2]); }
  for (const z of [-.07, 0, .07]) {
    mk(new THREE.TorusGeometry(.165, .012, 6, 36), d, ms, [0, 0, z]);
    mk(new THREE.TorusGeometry(.425, .012, 6, 72), d, is, [0, 0, z]);
  }
  const hullAt = off => {
    const pts = [];
    for (let i = 0; i < 96; i++) {
      const a = i / 96 * TAU;
      pts.push(new THREE.Vector2(MOTOR.x + Math.cos(a) * (.16 + off), MOTOR.y + Math.sin(a) * (.16 + off)));
      pts.push(new THREE.Vector2(JW.x + Math.cos(a) * (.42 + off), JW.y + Math.sin(a) * (.42 + off)));
    }
    return hull(pts);
  };
  const bp = hullAt(.022);
  for (const z of [-.07, 0, .07]) {
    const path = new THREE.CurvePath();
    for (let i = 0; i < bp.length; i++) {
      const a = bp[i], b = bp[(i + 1) % bp.length];
      path.add(new THREE.LineCurve3(new V3(a.x, a.y, BELTZ + z), new V3(b.x, b.y, BELTZ + z)));
    }
    const m = mk(new THREE.TubeGeometry(path, 260, .022, 6, true), p.m('rubber'), r);
    m.castShadow = false;
  }
  // guard (open-front band + back plate)
  const guard = new THREE.Group(); r.add(guard); p.addSub(guard, [0, 0, 1.1]);
  const outer = hullAt(.17), inner = hullAt(.11);
  const sh = new THREE.Shape(outer);
  sh.holes.push(new THREE.Path(inner.slice().reverse()));
  const gg = new THREE.ExtrudeGeometry(sh, { depth: .34, bevelEnabled: false });
  gg.translate(0, 0, BELTZ - .17);
  mk(gg, p.m('orange', true), guard);
  const bg = new THREE.ExtrudeGeometry(new THREE.Shape(outer), { depth: .02, bevelEnabled: false });
  bg.translate(0, 0, BELTZ - .19);
  mk(bg, p.m('orange', true), guard);
  p.clipN.set(0, 0, -1); p.clipP.set(-6, 1.3, BELTZ + .05);
  p.anchor.position.set(-6.1, 1.9, BELTZ + .17);
  p.callout(ms, [0, .16, .12], 'MOTOR SHEAVE', 'Ø 320 · 3-groove 5V');
  p.callout(is, [0, .42, .12], 'UNIT SHEAVE', 'Ø 840 · 5 spokes');
  p.callout(r, [-6, 1.55, BELTZ + .1], 'V-BELTS', '3 × 5V-1500 banded');
  p.callout(guard, [-6.6, 1.6, BELTZ + .17], 'BELT GUARD', 'OSHA 1910.219');
}

   5. KINEMATICS — 4-bar linkage solved every frame
   ===================================================================== */
function solve(phi) {
  const qx = C.x + CR * Math.cos(phi), qy = C.y + CR * Math.sin(phi);
  const dx = qx - P.x, dy = qy - P.y, dd = Math.hypot(dx, dy);
  const a = (BK * BK - PL * PL + dd * dd) / (2 * dd), h = Math.sqrt(Math.max(0, BK * BK - a * a));
  const mx = P.x + a * dx / dd, my = P.y + a * dy / dd;
  const e1x = mx + h * dy / dd, e1y = my - h * dx / dd, e2x = mx - h * dy / dd, e2y = my + h * dx / dd;
  const ex = e1x < e2x ? e1x : e2x, ey = e1x < e2x ? e1y : e2y;
  let th = Math.atan2(ey - P.y, ex - P.x);
  th = th > 0 ? th - Math.PI : th + Math.PI;
  return { qx, qy, ex, ey, theta: th };
}
const sOf = phi => HA * solve(phi).theta;
let S_MIN = 1e9, S_MAX = -1e9;
for (let i = 0; i < 720; i++) { const s = sOf(i / 720 * TAU); S_MIN = Math.min(S_MIN, s); S_MAX = Math.max(S_MAX, s); }

  allChip.classList.toggle('on', !p);
  for (const id in dockChips) dockChips[id].classList.toggle('on', p && p.id === id);
  for (const id in subRows) subRows[id].li.classList.toggle('on', p && p.id === id);
  $('#isoTxt').textContent = p ? pShort(p) : T('all');
  if (p && p.id === 'downhole' && !state.downT) setToggle('down', true, true);
  if (p && opts.fly) focusPart(p);

const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(x, y) {
  const rc = canvas.getBoundingClientRect();
  ndc.set((x - rc.left) / rc.width * 2 - 1, -(y - rc.top) / rc.height * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(pickables, false);
  for (const h of hits) {
    const p = h.object.userData.part;
    if (!p || !p.root.visible || p.ghost < .4) continue;
    if (h.object.material.userData?.cut && p.clip && p.clip.distanceToPoint(h.point) < 0) continue;
    if (h.object.material.opacity < .3 && !h.object.material.userData?.cut) continue;
    let o = h.object, vis = true; while (o) { if (!o.visible) { vis = false; break; } o = o.parent; }
    if (!vis) continue;
    return { part: p, point: h.point };
  }
  return null;
}
let down = null, hoverXY = null;
canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 5) { down = null; return; }
  down = null;
  const hit = pick(e.clientX, e.clientY);
  userAct();
  if (hit) { select(hit.part, { fly: hit.part !== state.selected }); setImmersive(true); }
  else if (state.selected) select(null);
});
canvas.addEventListener('dblclick', e => {
  const hit = pick(e.clientX, e.clientY);
  if (!hit) return;
  userAct();
  if (hit.part !== state.selected) select(hit.part, { silent: false });
  setImmersive(true);
  const dir = camera.position.clone().sub(hit.point).normalize();
  const dist = Math.max(.7, camera.position.distanceTo(hit.point) * .32);
  flyTo(hit.point.clone().addScaledVector(dir, dist).toArray(), hit.point.toArray(), 1.1);
});

/* =====================================================================
   10. LABELS (projected 3D anchors + leader lines)
   ===================================================================== */
const labelsEl = $('#labels'), svg = $('#leaders');
const pool = [];
function getLabel(i) {
  if (!pool[i]) {
    const el = document.createElement('div'); el.className = 'lbl';
    el.innerHTML = '<b></b><span></span>';
    el.onclick = () => { userAct(); const p = el._part; if (p) select(p, { fly: p !== state.selected }); };
    labelsEl.appendChild(el);
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
    line.setAttribute('fill', 'none'); line.setAttribute('stroke', '#ff5a1f'); line.setAttribute('stroke-width', '1');
    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    dot.setAttribute('r', '3'); dot.setAttribute('fill', '#ff5a1f');
    svg.append(line, dot);
    pool[i] = { el, line, dot, t: '', n: '' };
  }
  return pool[i];
}
const tmpV = new V3();
function updateLabels() {
  const W = innerWidth, H = innerHeight, items = [];
  if (state.labels && !fly) {
    if (state.selected) {
      const p = state.selected;
      items.push({ o: p.anchor, t: p.no + ' ' + pShort(p), n: pSub(p), p });
      p.callouts.forEach(c => items.push({ o: c.obj, t: cTitle(c), n: cNote(c), p }));
    } else {
      for (const p of parts) {
        if (!p.root.visible || p.ghost < .5) continue;
        if (p.id === 'downhole' && state.down < .6) continue;
        items.push({ o: p.anchor, t: p.no + ' ' + pShort(p), n: pSub(p), p });
      }
    }
  }
  const lb = document.getElementById('left'), rb = document.getElementById('right');
  const lr = lb.getBoundingClientRect(), rr = rb.getBoundingClientRect();
  const minX = (lr.right > 0 && lr.right < W / 2) ? lr.right + 12 : 12;
  const maxX = (rr.left < W && rr.left > W / 2) ? rr.left - 12 : W - 12;
  const vis = [];
  for (const it of items) {
    it.o.getWorldPosition(tmpV);
    tmpV.project(camera);
    if (tmpV.z > 1 || Math.abs(tmpV.x) > 1.05 || Math.abs(tmpV.y) > 1.05) continue;
    it.x = (tmpV.x + 1) / 2 * W; it.y = (1 - tmpV.y) / 2 * H;
    if (it.x < minX || it.x > maxX || it.y < 110 || it.y > H - 60) continue;
    it.side = it.x < (minX + maxX) / 2 ? -1 : 1;
    it.ly = it.y - 30;
    vis.push(it);
  }
  for (const side of [-1, 1]) {
    const s = vis.filter(v => v.side === side).sort((a, b) => a.ly - b.ly);
    for (let i = 1; i < s.length; i++) if (s[i].ly - s[i - 1].ly < 36) s[i].ly = s[i - 1].ly + 36;
  }
  vis.forEach((it, i) => {
    const L = getLabel(i);
    if (L.t !== it.t) { L.el.children[0].textContent = it.t; L.t = it.t; }
    if (L.n !== it.n) { L.el.children[1].textContent = it.n; L.n = it.n; }
    L.el._part = it.p;
    const w = L.el.offsetWidth || 140;
    const elbowX = it.x + it.side * 46;
    let lx = it.side > 0 ? elbowX + 6 : elbowX - 6 - w;
    lx = clamp(lx, minX, maxX - w);
    L.el.style.transform = `translate(${lx}px,${it.ly - 9}px)`;
    L.el.style.display = 'block';
    const endX = it.side > 0 ? lx : lx + w;
    L.line.setAttribute('points', `${it.x},${it.y} ${elbowX},${it.ly} ${endX},${it.ly}`);
    L.dot.setAttribute('cx', it.x); L.dot.setAttribute('cy', it.y);
    L.line.style.display = L.dot.style.display = '';
  });
  for (let i = vis.length; i < pool.length; i++) { pool[i].el.style.display = 'none'; pool[i].line.style.display = pool[i].dot.style.display = 'none'; }
}

function setupCanvas(c) { const r = c.getBoundingClientRect(); c.width = Math.max(1, r.width * DPR); c.height = Math.max(1, r.height * DPR); return c.getContext('2d'); }
const spark = $('#spark'), dyno = $('#dyno');
let sctx = setupCanvas(spark), dctx = setupCanvas(dyno);
const sparkData = [], dynoPts = [];
function drawSpark() {
  const c = spark, g = sctx, w = c.width, h = c.height;
  g.clearRect(0, 0, w, h);
  g.strokeStyle = '#e3dcd1'; g.lineWidth = DPR;
  for (const f of [.15, .5, .85]) { g.beginPath(); g.moveTo(0, h * f); g.lineTo(w, h * f); g.stroke(); }
  if (sparkData.length < 2) return;
  g.strokeStyle = '#ff5a1f'; g.lineWidth = 1.6 * DPR; g.beginPath();
  sparkData.forEach((v, i) => {
    const x = i / (240 - 1) * w, y = h * (.85 - (v - S_MIN) / STROKE_M * .7);
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  });
  g.stroke();
  const last = sparkData[sparkData.length - 1];
  g.fillStyle = '#ff5a1f'; g.beginPath();
  g.arc((sparkData.length - 1) / 239 * w, h * (.85 - (last - S_MIN) / STROKE_M * .7), 3 * DPR, 0, TAU); g.fill();
  g.fillStyle = '#8d867b'; g.font = `${9 * DPR}px JetBrains Mono`;
  g.fillText(T('top'), 2, h * .15 - 3 * DPR); g.fillText(T('bottom'), 2, h * .85 + 11 * DPR > h ? h - 2 : h * .85 - 3 * DPR);
}
function drawDyno(curS, curW) {
  const c = dyno, g = dctx, w = c.width, h = c.height, pad = 6 * DPR;
  g.clearRect(0, 0, w, h);
  const X = s => pad + (s - S_MIN) / STROKE_M * (w - pad * 2), Y = L => h - pad - L / 90 * (h - pad * 2);
  g.strokeStyle = '#e3dcd1'; g.lineWidth = DPR;
  for (let L = 0; L <= 90; L += 30) { g.beginPath(); g.moveTo(pad, Y(L)); g.lineTo(w - pad, Y(L)); g.stroke(); }
  g.fillStyle = '#b3ab9f'; g.font = `${8.5 * DPR}px JetBrains Mono`;
  for (let L = 30; L <= 90; L += 30) g.fillText(L, pad + 2, Y(L) - 3 * DPR);
  g.setLineDash([3 * DPR, 3 * DPR]); g.strokeStyle = '#c5bdb1';
  g.strokeRect(X(S_MIN), Y(38 + 26), X(S_MAX) - X(S_MIN), Y(38) - Y(38 + 26)); g.setLineDash([]);
  if (dynoPts.length > 2) {
    g.strokeStyle = '#1b1c1f'; g.lineWidth = 1.6 * DPR; g.beginPath();
    dynoPts.forEach(([s, L], i) => i ? g.lineTo(X(s), Y(L)) : g.moveTo(X(s), Y(L)));
    g.stroke();
  }
  g.fillStyle = '#ff5a1f'; g.beginPath(); g.arc(X(curS), Y(curW), 4 * DPR, 0, TAU); g.fill();
}

/* =====================================================================
   12. MAIN LOOP
   ===================================================================== */
const clock = new THREE.Clock();
let frame = 0, runtime = 0, strokes = 0, prevPhiTurn = 0, lastDir = 0, revS = 0, ftAvg = 16, ftN = 0;
let pprl = 0, mprl = 99, cyclePPRL = 0, cycleMPRL = 99;
const WR = 38, WF = 26;
const emis = new THREE.Color(1, .35, .12);
const clipPt = new V3(), clipNw = new V3();

function animate() {
  requestAnimationFrame(animate);
  tick(Math.min(clock.getDelta(), .05), true);
}
function tick(dt, draw) {
  frame++; runtime += dt;

  // adaptive resolution: drop pixel ratio if the GPU is struggling
  ftAvg += (dt * 1000 - ftAvg) * .05; ftN++;
  if (ftN > 180 && ftAvg > 26 && DPR > 1) { DPR = Math.max(1, DPR - .5); renderer.setPixelRatio(DPR); ftN = 0; sctx = setupCanvas(spark); dctx = setupCanvas(dyno); }

  // tour
  if (tour.playing) {
    tour.t += dt;
    if (tour.t >= TOUR_LEN) { tour.t = TOUR_LEN; setPlaying(false); }
    let idx = 0; for (let i = 0; i < TOUR.length; i++) if (tour.t >= TOUR[i].t) idx = i;
    if (idx !== tour.idx) { tour.idx = idx; TOUR[idx].run(); log(TOUR[idx].l, TOUR[idx].a, 'operator'); }
  }

  // drive + kinematics
  const k = 1 - Math.exp(-dt * 1.4);
  state.spm += ((state.running ? state.spmT : 0) - state.spm) * k;
  const omega = state.spm * TAU / 60;
  state.phi += omega * dt;
  const phi = state.phi, K = solve(phi), th = K.theta;
  const hD = .002, s = HA * th;
  const sP = sOf(phi + hD), sM = sOf(phi - hD);
  const TF = (sP - sM) / (2 * hD), vel = TF * omega, accel = (sP - 2 * s + sM) / (hD * hD) * omega * omega;

  // smooth display toggles
  const kk = 1 - Math.exp(-dt * 4);
  state.explode += (state.explodeT - state.explode) * kk;
  state.cut += (state.cutT - state.cut) * kk;
  state.xray += (state.xrayT - state.xray) * kk;
  state.down += (state.downT - state.down) * kk;

  const pb = partById;
  for (const arm of pb.cranks.arms) arm.rotation.z = phi;
  pb.gearbox.bull.rotation.z = phi;
  pb.gearbox.inter.rotation.z = -phi * 60 / 16 + .1;
  pb.gearbox.input.rotation.z = phi * R_GEAR;
  pb.belts.is.rotation.z = phi * R_GEAR;
  pb.belts.ms.rotation.z = phi * R_GEAR * R_BELT;
  pb.brake.drum.rotation.z = phi * R_GEAR;
  pb.motor.rotor.rotation.z = phi * R_GEAR * R_BELT;
  pb.beam.pivot.rotation.z = th;
  pb.horsehead.pivot.rotation.z = th;
  const ang = Math.atan2(K.ey - K.qy, K.ex - K.qx) - Math.PI / 2;
  for (const r of pb.pitman.rods) { r.g.position.set(K.qx, K.qy, r.z); r.g.rotation.z = ang; }
  pb.pitman.eq.position.set(K.ex, K.ey, 0); pb.pitman.eq.rotation.z = th;
  const yc = YC0 + s;
  pb.bridle.carrier.position.set(WX, yc, 0);
  for (const rp of pb.bridle.ropes) rp.scale.y = P.y - (yc + .12);
  pb.wellhead.rod.position.y = yc + .25 - 1.7;
  const hh = pb.horsehead;
  if (Math.abs(th - hh.lastTheta) > .0015) {
    hh.lastTheta = th;
    for (const m of hh.ropeArcs) { m.geometry.dispose(); m.geometry = new THREE.TorusGeometry(HA + .03, .025, 6, 40, hh.a1 + th); m.rotation.z = -th; }
  }
  // downhole pump
  const dh = pb.downhole;
  dh.rods.position.y = s;
  const up = vel > .002, dn = vel < -.002;
  dh.tBall.position.y += ((dn ? -13.56 : -13.66) - dh.tBall.position.y) * .25;
  dh.sBall.position.y += ((up ? -14.84 : -14.94) - dh.sBall.position.y) * .25;
  if (state.down > .05 && up) {
    const pa = dh.fluid.geometry.attributes.position, arr = pa.array, dy = vel * dt * 1.6;
    for (let i = 1; i < arr.length; i += 3) { arr[i] += dy; if (arr[i] > 1) arr[i] -= 16; }
    pa.needsUpdate = true;
  }

  // loads (simple rod-string model → dynamometer card + gearbox torque)
  const dir = up ? 1 : dn ? -1 : 0;
  if (dir && dir !== lastDir) { revS = s; lastDir = dir; }
  const prog = smooth(clamp(Math.abs(s - revS) / (.2 * STROKE_M), 0, 1));
  const fluid = lastDir > 0 ? WF * prog : WF * (1 - prog);
  const load = WR + fluid + WR * (accel / 9.81) * 2.2 + Math.sin(runtime * 23) * .35 * (state.spm / 7);
  const torque = TF * (load - WR - WF * .5);
  const gpct = clamp(Math.abs(torque) / 36 * 100, 0, 130);
  const kw = torque * omega / .88;
  if (state.spm > .2) {
    dynoPts.push([s, load]);
    const keep = Math.ceil(1.02 * 60 / Math.max(state.spm, .5) / Math.max(dt, .008));
    while (dynoPts.length > Math.min(keep, 2400)) dynoPts.shift();
    cyclePPRL = Math.max(cyclePPRL, load); cycleMPRL = Math.min(cycleMPRL, load);
  }
  if (Math.floor(phi / TAU) !== prevPhiTurn) { prevPhiTurn = Math.floor(phi / TAU); strokes++; pprl = cyclePPRL; mprl = cycleMPRL; cyclePPRL = 0; cycleMPRL = 99; }
  if (frame % 3 === 0) { sparkData.push(s); if (sparkData.length > 240) sparkData.shift(); }

  // explode + per-assembly teardown
  for (const p of parts) {
    p.open += (p.openT - p.open) * kk;
    p.root.position.copy(p.explodeOff).multiplyScalar(state.explode);
    const f = Math.max(state.explode, p.open);
    for (const sb of p.subs) sb.obj.position.copy(sb.off).multiplyScalar(f);
  }

  // ghosting / x-ray / hover highlight / section planes
  const sel = state.selected;
  for (const p of parts) {
    const other = state.isolate && sel && sel !== p;
    p.ghost += ((other ? .06 : 1) - p.ghost) * kk;
    const hl = (hovered === p ? .22 : 0) + (sel === p ? .1 : 0);
    p.hl += (hl - p.hl) * kk;
    const vis = p.id === 'downhole' ? state.down : 1;
    p.root.visible = vis > .02 && p.ghost > .02;
    for (const m of p.mats) {
      let o = m.userData.base * p.ghost * vis;
      if (m.userData.cut) o *= 1 - .85 * state.xray;
      m.opacity = o;
      m.transparent = o < .995 || m.userData.base < 1;
      m.depthWrite = o > .6;
      if (m.emissive) m.emissive.copy(emis).multiplyScalar(p.hl);
    }
    if (p.clip) {
      p.root.localToWorld(clipPt.copy(p.clipP));
      clipNw.copy(p.clipN);
      clipPt.addScaledVector(clipNw, -6 * (1 - state.cut));
      p.clip.setFromNormalAndCoplanarPoint(clipNw, clipPt);
    }
  }
  { const t = runtime; for (const fj of farJacks) { const a = Math.sin(t * fj.spm / 60 * TAU + fj.ph) * .22; for (const p of fj.pivots) p.rotation.z = a; } }
  field.userData.ground.material.opacity = 1 - state.down * .92; field.userData.ground.material.depthWrite = state.down < .5;
  field.userData.pad.material.opacity = 1 - state.down * .92;
  field.children.forEach(o => { if (o !== field.userData.ground && o !== field.userData.pad) o.visible = state.down < .6; });
  groundShadow.material.opacity = 0;
  partById.base.mats.forEach(m => { if (m.userData.base === 1) { m.opacity *= 1 - state.down * .55; m.transparent = m.opacity < .995; } });
  decor.children.forEach(hd => hd.children[0].rotation.z += hd.children[0].userData.spd * dt);

  // camera
  if (fly) {
    fly.t += dt / fly.dur;
    const e = ease(Math.min(1, fly.t));
    camera.position.lerpVectors(fly.p0, fly.p1, e);
    controls.target.lerpVectors(fly.t0, fly.t1, e);
    if (fly.t >= 1) fly = null;
  }
  controls.update();

  // hover (one raycast per frame max)
  if (hoverXY && frame % 2 === 0 && !down) {
    const hit = pick(hoverXY.x, hoverXY.y);
    hovered = hit ? hit.part : null;
    canvas.classList.toggle('hover', !!hit);
    if (hit) { tip.innerHTML = `${hit.part.no} ${pNameU(hit.part)}<i>${T(hit.part === sel ? 'dive' : 'click')}</i>`; tip.style.transform = `translate(${hoverXY.x + 14}px,${hoverXY.y + 14}px)`; tip.style.opacity = 1; }
    else tip.style.opacity = 0;
  }

  if (!draw) return;
  renderer.render(scene, camera);
  updateLabels();

  // HUD text (throttled)
  if (frame % 4 === 0) {
    $('#vSpm').innerHTML = state.spm.toFixed(1) + `<small>${T('u_spm')}</small>`;
    $('#vStroke').innerHTML = STROKE_IN.toFixed(0) + `<small>${T('u_in')}</small>`;
    $('#vStrokes').textContent = strokes.toLocaleString();
    $('#vDir').textContent = T(up ? 'up' : dn ? 'down' : 'hold');
    $('#vVel').textContent = vel.toFixed(2) + ' ' + T('u_ms');
    $('#vPprl').textContent = pprl.toFixed(1) + ' ' + T('u_kn');
    $('#vMprl').textContent = (mprl > 90 ? 0 : mprl).toFixed(1) + ' ' + T('u_kn');
    $('#vKw').innerHTML = kw.toFixed(1) + `<small>${T('u_kw')}</small>`;
    $('#vAmps').textContent = Math.abs(kw * 1000 / (1.732 * 460 * .86)).toFixed(0) + ' ' + T('u_a');
    $('#vRpm').textContent = Math.round(state.spm * 168.6) + ' ' + T('u_rpm');
    $('#vTorque').textContent = torque.toFixed(1) + ' ' + T('u_knm');
    const on = Math.round(gpct / 100 * 32);
    [...gsegs.children].forEach((el, i) => { el.className = i < on ? (i >= 32 ? 'hot' : 'on') : ''; });
    $('#hGpct').textContent = gpct.toFixed(0) + '%';
    const pl = Math.round(clamp(Math.abs(kw) / 15, 0, 1) * 9);
    [...pbars.children].forEach((el, i) => { el.className = i < pl ? (i < 2 ? 'hot' : 'on') : ''; });
    $('#hRuntime').textContent = '00:' + fmt(runtime);
    const mode = state.explode > .5 ? 'TEARDOWN' : state.down > .5 ? 'DOWNHOLE' : state.cut > .5 ? 'CUTAWAY' : state.xray > .5 ? 'X-RAY' : sel ? 'INSPECT' : state.spm > .3 ? 'PUMPING' : 'STANDBY';
    const modeTxt = isAr() ? MODES_AR[mode] : mode;
    $('#modeName').textContent = modeTxt; $('#hStatus').textContent = modeTxt;
    const pctA = Math.round(state.explode * 100);
    $('#modeSub').textContent = sel
      ? (isAr() ? `${pShort(sel)} · مفكك ${pctA}%` : `${sel.short} · ${pctA}% APART`)
      : (isAr() ? `${state.spm.toFixed(1)} شوط/د · الشوط ${STROKE_IN.toFixed(0)} بوصة` : `SPM ${state.spm.toFixed(1)} · STROKE ${STROKE_IN.toFixed(0)} IN`);
    $('#opTime').textContent = fmt(tour.t) + ' / ' + fmt(TOUR_LEN);
    const pct = tour.t / TOUR_LEN * 100;
    $('#tFill').style.width = pct + '%'; $('#tKnob').style.left = pct + '%';
    for (const p of parts) {
      const r = subRows[p.id]; let txt, cls;
      if (state.explode > .5) { txt = 'DETACHED'; cls = 'acc'; }
      else if (p.open > .5) { txt = 'OPEN'; cls = 'acc'; }
      else if (p.clip && state.cut > .5 && (p.id !== 'downhole' || state.down > .5)) { txt = 'SECTIONED'; cls = 'acc'; }
      else if (p.id === 'downhole') { txt = state.down > .5 ? 'PUMPING' : 'BURIED'; cls = state.down > .5 ? '' : 'idle'; }
      else if (['base', 'samson'].includes(p.id)) { txt = 'NOMINAL'; cls = ''; }
      else if (p.id === 'brake') { txt = state.running ? 'RELEASED' : 'SET'; cls = state.running ? 'idle' : 'acc'; }
      else { txt = state.spm > .3 ? 'RUNNING' : 'IDLE'; cls = state.spm > .3 ? '' : 'idle'; }
      const shown = isAr() ? PILLS_AR[txt] : txt;
      if (r.pill.textContent !== shown) { r.pill.textContent = shown; r.pill.className = 'pill ' + cls; }
    }
  }
  if (frame % 2 === 0) { drawSpark(); drawDyno(s, load); }
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight, false);
  sctx = setupCanvas(spark); dctx = setupCanvas(dyno);
});

function applyLang(l) {
  LANG = l;
  try { localStorage.setItem('pj-lang', l); } catch (e) {}
  document.documentElement.lang = l;
  document.body.classList.toggle('ar', l === 'ar');
  document.querySelectorAll('[data-i18n]').forEach(el => { const v = I18N[el.dataset.i18n]; if (v) el.textContent = v[l === 'ar' ? 1 : 0]; });
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === l));
  allChip.innerHTML = `<em>00</em>${T('all')}`;
  ORDER.forEach(id => {
    const p = partById[id];
    dockChips[id].innerHTML = `<em>${p.no}</em>${pShort(p)}`;
    subRows[id].li.querySelector('.n').textContent = pNameU(p);
    subRows[id].li.querySelector('.d').textContent = pSub(p);
    subRows[id].pill.textContent = '';
  });
  ticks.forEach((tk, i) => tk.dataset.l = l === 'ar' ? TOUR[i + 1].a : TOUR[i + 1].l);
  $('#opCount').textContent = TOUR.length + ' ' + T('actions');
  $('#btnRun').textContent = T(state.running ? 'running' : 'stopped');
  $('#spmLbl').textContent = (+rSpm.value).toFixed(1) + ' ' + T('u_spm');
  $('#isoTxt').textContent = state.selected ? pShort(state.selected) : T('all');
  renderInspector(); renderLog();
}
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => applyLang(b.dataset.lang));
$('#showUI').onclick = () => setImmersive(false);
if (/[?&]lang=ar/.test(location.search)) LANG = 'ar';
applyLang(LANG);
setToggle('labels', true, true);
// deep links: #gearbox  #explode  #down  #cut  #xray  (combine with +, e.g. #gearbox+cut)
function applyHash() {
  const keys = decodeURIComponent(location.hash.slice(1)).toLowerCase().split('+').filter(Boolean);
  if (!keys.length) return;
  setPlaying(false); tour.idx = 0;
  for (const k of keys) {
    if (partById[k]) select(partById[k], { fly: true, silent: true });
    else if (k === 'open' && state.selected) state.selected.openT = 1;
    else if (k === 'iso') state.isolate = true;
    else if (k === 'view') setImmersive(true);
    else if (toggles[k]) setToggle(k, true, true);
  }
  if (keys.includes('down') && !keys.some(k => partById[k])) flyTo([15, -2.5, 19], [WX - 1, -8.5, 0], 1.8);
  else if (!keys.some(k => partById[k])) flyView(keys.includes('explode') ? 'tear' : 'home');
}
addEventListener('hashchange', applyHash);
applyHash();
// test hook: ?warm=N fast-forwards N frames (used for headless screenshots)
const WARM = +new URLSearchParams(location.search).get('warm') || 0;
for (let i = 0; i < WARM; i++) tick(1 / 30, false);
if (WARM) { clock.getDelta(); ftN = -1e9; document.body.dataset.cam = camera.position.toArray().map(v=>v.toFixed(2)).join(',') + ' | ' + controls.target.toArray().map(v=>v.toFixed(2)).join(','); }
animate();
requestAnimationFrame(() => { const l = $('#loader'); l.style.opacity = 0; setTimeout(() => l.remove(), 900); });
</script>
