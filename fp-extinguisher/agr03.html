<style>

.win{color:var(--ok)} .warn{color:var(--warn)} .lose{color:var(--bad)}

<script type="module">
/* AGR-03 · The Wilting Tomato (look before you water). A short, calm greenhouse visit for agricultural technical-school
   students (16-18): one tomato plant droops at noon and its lower leaves turn yellow; the student looks, checks, asks and
   recommends. A training simulation in a made-up school greenhouse, not a real farm procedure.
   Built the same way as saf01.html (same renderer, Poly Haven materials, Rocketbox clips driving Renderpeople people, the
   same test hooks). This file: step 1 = the greenhouse, the plant and its symptoms, the cast, walking and E to look. */
import * as THREE from 'three';

const params = new URLSearchParams(location.search);

/* =====================================================================
   0. TEXT (Arabic only / English only)
   ===================================================================== */
const STR = {

  title: ['الطماطم الذابلة', 'The Wilting Tomato'],
  intro: ['صوبة المدرسة، الساعة ١٢:٣٠ الضهر. على المصطبة ٢ أصيص طماطم بيتدلّى وورقه اللي تحت بيصفّر. م. هالة مشرفة الصوبة عايزة رأيك قبل ما حد يعمل أي حاجة، وعم فتحي عامل الصوبة جنب ترابيزة الزراعة. بُص، وافحص، واسأل، وبعدين اقترح — من غير ما ترش أو تضيف أي حاجة.',
          'The school greenhouse at 12:30. On bench 2 a tomato plant droops and its lower leaves are turning yellow. Eng. Hala, the greenhouse supervisor, wants your view before anyone does anything; Mr. Fathy, the greenhouse worker, is at the potting table. Look, check, ask, then recommend — without spraying or adding anything.'],

  h_click: ['انقر للنظر', 'Click to look'], h_move: ['للحركة', 'move'], h_crouch: ['انزل', 'crouch'], h_use: ['للفحص', 'check'],

const T = k => STR[k] ? STR[k][LANG === 'ar' ? 0 : 1] : k;
const L2 = p => p ? p[LANG === 'ar' ? 0 : 1] : '';

/* =====================================================================
   1. QUALITY + RENDERER + SCENE
   ===================================================================== */
const QUAL = { low: { dpr: 1, shadows: false }, high: { dpr: Math.min(window.devicePixelRatio || 1, 2), shadows: true } };
let quality = params.get('q') || (() => { try { return localStorage.getItem('fp-q'); } catch (e) { return null; } })() || 'high';
const Q = () => QUAL[quality];
const HIQ = () => quality !== 'low';
const OFF = k => params.has('no' + k);              // test switches (?noprops ?nomaps)

const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });

const hemi = new THREE.HemisphereLight(0xe8f0f6, 0x6a5a44, .55); world.add(hemi);

function mk(geo, mat, parent, p = [0, 0, 0], r = [0, 0, 0], shadow = true) {

}

const rbox = (w, h, d, r = .01) => new RoundedBoxGeometry(w, h, d, 3, r);
const cyl = (rt, rb, h, s = 24, open = false) => new THREE.CylinderGeometry(rt, rb, h, s, 1, open);
const std = (color, roughness = .8, metalness = 0, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness, metalness, ...extra });
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); }
  t.userData.redraw = () => { draw(c.getContext('2d'), w, h); t.needsUpdate = true; };
  return t;
}
function speckle(g, w, h, n, alpha, light) { for (let i = 0; i < n; i++) { const v = light ? 255 : 0; g.fillStyle = `rgba(${v},${v},${v},${rnd() * alpha})`; const s = rnd() * 2.2 + .4; g.fillRect(rnd() * w, rnd() * h, s, s); } }
function blotches(g, w, h, n, col, alpha, rmax) {
  for (let i = 0; i < n; i++) { const x = rnd() * w, y = rnd() * h, r = rnd() * rmax + 10; const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, `rgba(${col},${alpha * rnd()})`); gr.addColorStop(1, `rgba(${col},0)`); g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); }
}
const AR_FONT = "'IBM Plex Sans Arabic', sans-serif";
const concreteTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#9a968e'; g.fillRect(0, 0, w, h); blotches(g, w, h, 40, '60,58,52', .14, 90); blotches(g, w, h, 30, '210,206,198', .1, 80);
  speckle(g, w, h, 9000, .2, false); speckle(g, w, h, 5000, .16, true);

  const talker = G.talker && npc(G.talker) ? npc(G.talker) : null;
  for (const c of crowd.list) {
    if (c.gone) continue;
    const s = c.script[c.i], walking = s && s.a === 'go', near = player.pos.distanceTo(c.pos) < 3.2;
    // a glance at you only when you are in front or to the side (not over the shoulder while they work)
    const toYou = Math.atan2(player.pos.x - c.pos.x, player.pos.z - c.pos.z) - c.yaw, inFront = Math.abs(Math.atan2(Math.sin(toYou), Math.cos(toYou))) < 1.6;
    let la = walking ? null : talker === c ? 'player' : talker ? headPos(talker) : (G.talker === 'you' || (near && inFront)) ? 'player' : c.lookPlant ? POT.clone().add(new V3(0, .3, 0)) : null;
    // listeners only turn to someone in front of them or to the side, within a few metres — never over the shoulder
    if (la && la !== 'player' && talker !== c && !c.engaged) {
      const dx = la.x - c.pos.x, dz = la.z - c.pos.z, a = Math.atan2(dx, dz) - c.yaw;
      if (Math.hypot(dx, dz) > 4.5 || Math.abs(Math.atan2(Math.sin(a), Math.cos(a))) > 1.6) la = null;
    }
    c.lookAt = la;
    c.engaged = !walking && (talker === c || (G.choice && G.choice.npc === c.w.id) || (G.talker === 'you' && player.pos.distanceTo(c.pos) < 2.2));
    c.turnTo = c.engaged ? player.pos : null;
  }
}

const post = (() => {                                   // lens vignette + light film grain on the finished frame
  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uGrain: { value: .045 }, uVig: { value: .38 }, uAspect: { value: 1 } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }',
    fragmentShader: `uniform float uTime, uGrain, uVig, uAspect; varying vec2 vUv; float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
      void main(){ vec2 c = (vUv - .5) * vec2(uAspect, 1.); float vig = 1. - uVig * smoothstep(.08, .62, dot(c, c)); float g = 1. - uGrain * h(floor(gl_FragCoord.xy) + fract(uTime * 7.3) * 113.); gl_FragColor = vec4(vec3(vig * g), 1.); }`,
    depthTest: false, depthWrite: false, toneMapped: false, transparent: true, blending: THREE.CustomBlending, blendEquation: THREE.AddEquation, blendSrc: THREE.DstColorFactor, blendDst: THREE.ZeroFactor,
  });
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat), sc = new THREE.Scene(), cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  quad.frustumCulled = false; sc.add(quad); const resize = () => { mat.uniforms.uAspect.value = innerWidth / innerHeight; }; resize();
  return { mat, sc, cam, resize, on: params.get('post') !== '0' };
})();

const clock = new THREE.Clock();
function tick(dt, draw) {
  sim.frame++;
  const live = sim.running && !sim.ended;
  if (live) { sim.t += dt; if (!G.begun) { G.begun = true; startFlow(); } }
  updatePlayer(live ? dt : 0);
  updateHand(dt);
  if (live) updateFlow(dt);
  updateWorkers(dt); updateRP(); for (const r of RP) { updateFace(r, dt); if (r.knead) updateKnead(r, dt); } plantState(sim.t);
  if (sim.frame % 3 === 0) updateHUD(dt * 3);
  if (!draw) return;
  renderer.clear(); renderer.render(world, camera);
  if (post.on) { post.mat.uniforms.uTime.value = sim.t + sim.frame * .016; renderer.render(post.sc, post.cam); }
}
const FREEZE = params.has('freeze');
const PERF = params.has('perf') ? { t0: 0, frames: [], js: [] } : null;
function loop(now) {
  requestAnimationFrame(loop);
  const a = performance.now(); tick(FREEZE ? 0 : Math.min(clock.getDelta(), .05), true);
  if (PERF && now) {
    if (!PERF.t0) PERF.t0 = now; PERF.frames.push(now); PERF.js.push(performance.now() - a);
    if (now - PERF.t0 > 8000 && !window.__perf) {
      const iv = PERF.frames.slice(30).map((t, i, A) => i ? t - A[i - 1] : 0).slice(1).sort((x, y) => x - y), avg = A => +(A.reduce((s, v) => s + v, 0) / Math.max(A.length, 1)).toFixed(1);
      const gl = renderer.getContext(), dbg = gl.getExtension('WEBGL_debug_renderer_info');
      window.__perf = { gpu: dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : '?', fps: +(1000 / avg(iv)).toFixed(1), frameMs: { avg: avg(iv), p95: +(iv[Math.floor(iv.length * .95)] || 0).toFixed(1) }, jsMs: avg(PERF.js) };
    }
  }
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight, false); post.resize(); });

// fonts first so the in-world signs draw with the Arabic font
await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]);
for (const t of [cardTex, ...BENCH_TEX]) t.userData.redraw();
for (const L of LEAVES) L.rx0 = L.arm.rotation.x;
try { await Promise.all([...PROPS, ...LOAD]); } catch (e) { console.warn('props:', e); }
try { await loadWorkers(); } catch (e) { console.warn('workers not loaded:', e); }
if (params.get('rp') !== '0') await Promise.all(crowd.list.filter(c => c.w.rp).map(c => attachRP(c, c.w.rp).catch(e => console.warn(`Renderpeople ${c.w.rp} not loaded:`, e))));
try { await loadHand(); gripFromHand(); await loadGrip(); } catch (e) { console.warn('hand not loaded:', e); }
try { await loadVoices(); } catch (e) { console.warn('voices not loaded:', e); }
applyLang(); applyQuality(); renderBook();
// test hooks (same names as saf01.html)
if (params.has('yaw')) player.yaw = +params.get('yaw');
if (params.has('px')) { player.pos.x = +params.get('px'); player.pos.z = +params.get('pz'); player.pitch = +(params.get('pitch') || 0); }
if (params.has('crouch')) player.crouchHeld = true;
if (params.get('play') === '1') { sim.running = true; sim.started = true; showMenu(false); }
if (params.get('demo') === '1') startDemo();
if (params.has('nohud')) $('#hud').style.display = 'none';
if (params.has('ending')) { G.begun = true; demoEnding(clamp(+params.get('ending'), 1, 3)); sim.running = true; sim.started = true; showMenu(false); }
if (params.has('say')) { const [who, k] = params.get('say').split(':'); G.begun = true; G.phase = 'visit'; add({ wait: .4 }, { say: who, k }); }   // ?say=fathy:fathy_ans — one line alone (lip checks)
if (params.has('hand')) { G.begun = true; G.phase = 'visit'; handTouch(+params.get('hand') || .03); }
if (params.has('pot')) { G.begun = true; G.phase = 'visit'; potLift(); }      // ?pot=1 — the pot check alone (screenshots)   // ?hand=0.03 — the soil touch alone (screenshots)
window.__agr = { G, crowd, RP, HAND, player, camera, world, Engine, VOICE, DLG, POT, V3, NB, POTA, potBody, C_POT, POT_AIM, potLift, LEAVES, leafPt, GEST, potLocal: w => { potBody.updateMatrixWorld(true); return potBody.worldToLocal(w.clone()); }, tick: (n, dt = 1 / 30) => { for (let i = 0; i < n; i++) tick(dt, false); } };
const WARM = +params.get('warm') || 0;
for (let i = 0; i < WARM; i++) tick(1 / 30, false);
if (WARM) document.body.dataset.state = JSON.stringify({ phase: G.phase, clock: G.clockMin, seen: [...G.seen], ev: G.ev, tries: G.tries, ended: G.ended, fathy: G.fathy, guess: G.guess, q: G.q.map(a => a.say ? 'say:' + a.k : a.ask ? 'ask:' + a.qk : a.card ? 'card' : a.wait !== undefined ? 'wait' : a.until ? 'until' : 'run') });
clock.getDelta();
loop();
</script>
</body>
