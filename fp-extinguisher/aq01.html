<script type="module">
import * as THREE from 'three';
const V3 = THREE.Vector3, TAU = Math.PI * 2;
const params = new URLSearchParams(location.search);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v)), lerp = (a, b, t) => a + (b - a) * t;
const mj = u => { u = clamp(u, 0, 1); return u * u * u * (10 - 15 * u + 6 * u * u); };
const $ = s => document.querySelector(s);

/* =====================================================================
   0. TEXT (Arabic first; English kept for review). The lines follow the situation script (English drafts) in Modern Standard Arabic.
   ===================================================================== */
let LANG = params.get('lang') || (() => { try { return localStorage.getItem('aq-lang'); } catch (e) { return null; } })() || 'ar';
const STR = {
  title: ['ساكنٌ في الحارة الرابعة', 'Still in Lane Four'],

  intro: ['أنت المنقذ الرئيسي على حوض المنافسات في بطولة ناشئين. راقب منطقتك جيدًا: أخطر لحظة هي بعد نهاية السباق مباشرة.', 'You are the lead lifeguard on the competition pool at a junior championship. Watch your zone: the most dangerous moment is right after a finish.'],

  start: ['ابدأ', 'Start'], demo: ['شاهد عرضًا', 'Watch a demo'],
  briefId: ['إحاطة قبل المناوبة', 'Pre-shift briefing'], briefTitle: ['مركز الواحة للرياضات المائية', 'Al-Waha Aquatics Centre'],
  brief: ['أنت المنقذ الرئيسي على حوض المنافسات. منطقتك: الحارات ١–٤، من جدار النهاية حتى منتصف الحوض. التصفية الثالثة من سباق ٥٠ م ظهر، ثم التصفية الرابعة من سباق ٥٠ م صدر. الجلسة متأخرة.', 'You are the lead lifeguard on the competition pool. Your zone: lanes 1–4, finish end to halfway. Heat 3 of the 50 m backstroke, then heat 4 of the 50 m breaststroke. Session running late.'],
  briefGo: ['إلى الكرسي', 'To the chair'],
  k_look: ['النظر', 'Look'], k_stand: ['قف على الكرسي / اجلس', 'Stand up in the chair / sit'], k_down: ['انزل من الكرسي / اصعد', 'Climb down / back up'],
  k_move: ['المشي على الحافة', 'Walk the deck'], k_whistle: ['صفّارة الطوارئ (إيقاف وإشارة)', 'Emergency whistle (stop + point)'],
  h_seat: ['مسافة: قف', 'Space: stand'], h_stand: ['مسافة: اجلس', 'Space: sit'], h_down: ['E: انزل', 'E: climb down'], h_up: ['E: اصعد إلى الكرسي', 'E: back to the chair'],
  h_whistle: ['F: صفّارة', 'F: whistle'],
  endId: ['نهاية المرحلة الأولى', 'End of phase 1'], again: ['أعد المحاولة', 'Try again'],
  endNext: ['المرحلة التالية: النزول إلى الماء، الإخراج، وسلسلة الإسعاف.', 'Next phase: entering the water, the recovery and the rescue chain.'],
};
const NAMES = { mgr: ['مدير المناوبة (لاسلكي)', 'Duty manager (radio)'], ref: ['الحكم الرئيسي ناصر', 'Chief referee Nasser'], starter: ['حكم البدء', 'Starter'], timing: ['مسؤول التوقيت', 'Timing official'],
  fahad: ['فهد (المنقذ الثاني)', 'Fahad (second lifeguard)'], omar: ['عمر، الحارة ٥', 'Omar, lane 5'], you: ['أنت', 'You'], kid: ['سبّاح على المنصّة ٤', 'Swimmer on block 4'], crowd: ['المدرّجات', 'The stand'] };
const LINES = {
  mgr_open: ['صباح الخير. نحن ناقصون اليوم؛ نُقل ماجد إلى منطقة التجميع، فحوض الإحماء للمدربين فقط. أنت وفهد على الحوض الرئيسي. نادِني إن احتجت شيئًا.', "Morning. We're short today — Majed went to marshalling, so the warm-up pool is coaches only. You and Fahad have the main pool. Shout if you need anything."],
  st_marks3: ['التصفية الثالثة… خذوا أماكنكم.', 'Heat three… take your marks.'],
  timing_ask: ['هل يمكن لأحدكما أن يمسك لوحة اللمس هذه بينما أعيد تثبيتها؟ دقيقتان فقط.', 'Can one of you hold this touch pad while I re-seat it? Two minutes.'],
  fahad_swap: ['أنا هنا منذ الثامنة… هل من بديل؟', "I've been on since eight. Any chance of a swap?"],
  ref_out: ['التصفية الثالثة، اخرجوا من فضلكم. التصفية الرابعة إلى منصّات البدء.', 'Heat three, out please. Heat four to the blocks.'],
  omar_alert: ['يا أستاذ! هناك أحدٌ في القاع!', "Sir, there's someone at the bottom!"],
  ref_dismiss: ['خلف المنصّة من فضلك. ركّز على سباقك.', 'Behind the block, please. Concentrate on your race.'],
  ref_marks: ['خذوا أماكنكم.', 'Take your marks.'],
  ref_heat5: ['التصفية الخامسة إلى المنصّات.', 'Heat five to the blocks.'],
  kid_scream: ['آآه! هناك أحدٌ تحت الماء! الحارة الرابعة!', "Aah! There's someone under the water! Lane four!"],
  crowd_shout: ['صراخ في المدرّجات…', 'Shouting in the stand…'],
  you_stop: ['توقّفوا! سبّاحٌ غارق، الحارة الرابعة!', 'Stop! Swimmer down, lane four!'],
};
const T = k => STR[k] ? STR[k][LANG === 'ar' ? 0 : 1] : k, L2 = p => p ? p[LANG === 'ar' ? 0 : 1] : '';
function applyLang() {
  document.documentElement.lang = LANG; document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr';
  document.body.classList.toggle('en', LANG !== 'ar');
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = T(el.dataset.t));
  $('#keys').innerHTML = [['Mouse', 'k_look'], ['Space', 'k_stand'], ['E', 'k_down'], ['W A S D', 'k_move'], ['F', 'k_whistle']].map(([k, t]) => `<span><span class="kc">${k}</span></span><span>${T(t)}</span>`).join('');
  document.querySelectorAll('#segL button').forEach(b => b.classList.toggle('on', b.dataset.l === LANG));
}
document.querySelectorAll('#segL button').forEach(b => b.onclick = () => { LANG = b.dataset.l; try { localStorage.setItem('aq-lang', LANG); } catch (e) {} applyLang(); });
applyLang();

/* =====================================================================
   1. RENDERER, SCENE, CAMERA
   ===================================================================== */
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = .9;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fb3c2);
const camera = new THREE.PerspectiveCamera(68, innerWidth / innerHeight, .05, 300);
camera.rotation.order = 'YXZ';
const UNDER = 1;                                      // layer: what can be seen through the water (pool shell, swimmers, the casualty)

/* ---- the place (metres, Y up). Water surface y = 0, pool floor y = -2. The pool runs along X: start end x = -25, FINISH END x = +25.
   Lanes along Z: lane i centre z = -8.75 + 2.5 (i - 1). The lead lifeguard's raised chair is beside lane 1 (z < -10.5), towards the
   finish end; the zone is lanes 1–4 from the finish wall to halfway. The stand is on the far side (z > 14). ---- */
const POOL = { x0: -25, x1: 25, z0: -10.5, z1: 10.5, depth: 2 }, DECK_Y = .12;
const laneZ = i => -8.75 + 2.5 * (i - 1);
const HALL = { x0: -34, x1: 31, z0: -34, z1: 27, h: 12.5 };
const CHAIR = { x: 14, z: -12.2, seatY: 1.45, footY: 1.0 };
// the glare: a sunlit band of glazing high in the finish-end wall. What hides the bottom is its mirror image on the water where your
// line of sight crosses the surface (real mirror geometry, computed exactly in the water shader): from the seat that image lies over
// the bottom of lanes 3–5 near the finish wall; stand up in the chair (+0.8 m) or walk to the edge and it slides off.
const GLARE = { x: HALL.x1 - .02, y0: 4.9, y1: 5.9, z0: 3.0, z1: 13.0, rad: new THREE.Color(1, .97, .9).multiplyScalar(20) };

/* =====================================================================
   2. MATERIALS: procedural tiles (pool shell, deck, walls) with caustic light on the pool shell
   ===================================================================== */
const U = { time: { value: 0 }, sunDir: { value: new V3(-.35, .86, .37).normalize() }, caust: { value: 1 } };
const NOISE_GLSL = `
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float caustic(vec2 p, float t){                      // bright filaments of light focused by the moving surface (own design)
  vec2 q = p * .9; float c = 0.;
  for (int i = 0; i < 4; i++) {
    float fi = float(i);
    q = mat2(.8, .6, -.6, .8) * q * 1.27;
    q += .55 * vec2(sin(q.y * .83 + t * (.55 + fi * .12) + fi), sin(q.x * .91 - t * (.47 + fi * .1) - fi * 1.7));
    float s = abs(sin(q.x) * .5 + sin(q.y) * .5);
    c += .012 / (.006 + s * s) * (1. / (1. + fi * .6));
  }
  return c;
}`;
function tileMat({ base, grout, tile = .125, gw = .006, rough = .35, lanes = false, caust = false, wall = false }) {
  const m = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: rough, metalness: 0 });
  m.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, { uTime: U.time, uSun: U.sunDir, uCaust: U.caust });
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vW; varying vec3 vNw;')
      .replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\nvW = (modelMatrix * vec4(transformed, 1.)).xyz; vNw = normalize(mat3(modelMatrix) * objectNormal);');
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', `#include <common>
      varying vec3 vW; varying vec3 vNw; uniform float uTime; uniform vec3 uSun; uniform float uCaust;
      ${NOISE_GLSL}
      float gridLine(vec2 p, float w){ vec2 f = abs(fract(p) - .5); vec2 d = fwidth(p); vec2 a = smoothstep(.5 - w - d, .5 - w + d, f); return max(a.x, a.y); }`)
      .replace('#include <map_fragment>', `#include <map_fragment>
      {
        vec3 n = abs(vNw); vec2 uv = n.y > .5 ? vW.xz : (n.x > .5 ? vW.zy : vW.xy);
        vec2 tp = uv / ${tile.toFixed(4)};
        float g = gridLine(tp, .5 - ${(gw / tile * .5).toFixed(4)});
        vec2 cell = floor(tp); float v = hash12(cell);
        vec3 col = vec3(${base.map(x => x.toFixed(3)).join(',')}) * (.94 + .1 * v);
        col = mix(col, vec3(${grout.map(x => x.toFixed(3)).join(',')}), g);
        ${lanes ? `
        // lane markings on the floor: a dark stripe down each lane centre ending in a T 2 m from each wall; end-wall targets
        if (n.y > .5) {
          for (int i = 0; i < 8; i++) {
            float zc = -8.75 + 2.5 * float(i);
            float sx = step(abs(vW.z - zc), .125) * step(abs(vW.x), 22.0);
            float tx = step(abs(vW.z - zc), .5) * step(abs(abs(vW.x) - 22.0), .125);
            col = mix(col, vec3(.04, .07, .14), max(sx, tx));
          }
        } else if (n.x > .5) {
          for (int i = 0; i < 8; i++) { float zc = -8.75 + 2.5 * float(i); float t = step(abs(vW.z - zc), .125) * step(-1.5, vW.y) * step(vW.y, -.3); float c = step(abs(vW.z - zc), .25) * step(abs(vW.y + .6), .125); col = mix(col, vec3(.04, .07, .14), max(t, c)); }
        }` : ''}
        diffuseColor.rgb *= col;
      }`)
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
      ${caust ? `{ float dep = clamp(-vW.y, 0., 3.); float c = caustic(vW.xz + vec2(vW.y * .35), uTime * 1.1) * uCaust;
        float facing = ${wall ? '.55' : '1.0'}; totalEmissiveRadiance += diffuseColor.rgb * c * .55 * facing * exp(-dep * .18); }` : ''}`);
  };
  m.customProgramCacheKey = () => 'tile' + base + grout + lanes + caust + wall + tile;
  return m;
}
const M = {
  poolFloor: tileMat({ base: [.86, .93, .97], grout: [.62, .74, .82], tile: .125, lanes: true, caust: true, rough: .3 }),
  poolWall: tileMat({ base: [.84, .92, .97], grout: [.6, .72, .8], tile: .125, lanes: true, caust: true, wall: true, rough: .3 }),
  deck: tileMat({ base: [.78, .78, .75], grout: [.55, .55, .52], tile: .3, gw: .008, rough: .7 }),
  wallTile: tileMat({ base: [.9, .9, .88], grout: [.7, .7, .68], tile: .2, rough: .45 }),
  plaster: new THREE.MeshStandardMaterial({ color: 0xd9dcd8, roughness: .9 }),
  steel: new THREE.MeshStandardMaterial({ color: 0x8d969e, roughness: .45, metalness: .7 }),
  white: new THREE.MeshStandardMaterial({ color: 0xf2f2ee, roughness: .5 }),
  blue: new THREE.MeshStandardMaterial({ color: 0x1d4f9c, roughness: .55 }),
  dark: new THREE.MeshStandardMaterial({ color: 0x1e2328, roughness: .8 }),
  grate: new THREE.MeshStandardMaterial({ color: 0x5c6a72, roughness: .6, metalness: .2 }),
  seat: new THREE.MeshStandardMaterial({ color: 0x2a6fb5, roughness: .6 }),
  red: new THREE.MeshStandardMaterial({ color: 0xc8312b, roughness: .55 }),
  yellow: new THREE.MeshStandardMaterial({ color: 0xe8c43a, roughness: .55 }),
  glass: new THREE.MeshStandardMaterial({ color: 0x9fb8c6, roughness: .05, metalness: .1, transparent: true, opacity: .35 }),
};
const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
function mk(geo, mat, parent = scene, pos = [0, 0, 0], rot = [0, 0, 0], shadow = true) {
  const m = new THREE.Mesh(geo, mat); m.position.set(...pos); m.rotation.set(...rot);
  if (shadow) { m.castShadow = true; m.receiveShadow = true; }
  parent.add(m); return m;
}

/* =====================================================================
   3. THE HALL
   ===================================================================== */
const hall = new THREE.Group(); scene.add(hall);
// pool shell: floor and four walls (visible only through the water: layer UNDER)
{
  const W = POOL.x1 - POOL.x0, Dz = POOL.z1 - POOL.z0, H = POOL.depth;
  const f = mk(new THREE.PlaneGeometry(W, Dz, 1, 1), M.poolFloor, hall, [0, -H, 0], [-Math.PI / 2, 0, 0], false); f.receiveShadow = true; f.layers.set(UNDER);
  for (const [w, pos, ry] of [[W, [0, -H / 2, POOL.z0], 0], [W, [0, -H / 2, POOL.z1], Math.PI], [Dz, [POOL.x0, -H / 2, 0], Math.PI / 2], [Dz, [POOL.x1, -H / 2, 0], -Math.PI / 2]]) {
    const m = mk(new THREE.PlaneGeometry(w, H), M.poolWall, hall, pos, [0, ry, 0], false); m.receiveShadow = true; m.layers.set(UNDER);
  }
}
// deck around the pool (a frame of slabs) and the overflow gutter grating at the water's edge
{
  const t = .3, gy = DECK_Y - .05;
  const slab = (x0, x1, z0, z1) => mk(box(x1 - x0, .2, z1 - z0), M.deck, hall, [(x0 + x1) / 2, DECK_Y - .1, (z0 + z1) / 2], [0, 0, 0], false).receiveShadow = true;
  slab(HALL.x0, HALL.x1, HALL.z0, POOL.z0 - t); slab(HALL.x0, HALL.x1, POOL.z1 + t, HALL.z1);
  slab(HALL.x0, POOL.x0 - t, POOL.z0 - t, POOL.z1 + t); slab(POOL.x1 + t, HALL.x1, POOL.z0 - t, POOL.z1 + t);
  const g = (w, d, x, z) => mk(box(w, .06, d), M.grate, hall, [x, gy, z], [0, 0, 0], false);
  g(POOL.x1 - POOL.x0 + 2 * t, t, 0, POOL.z0 - t / 2); g(POOL.x1 - POOL.x0 + 2 * t, t, 0, POOL.z1 + t / 2);

function glareCover(eye = camera.position) {

    const B = b.clone().addScaledVector(ax, i * .19); if (B.y > -.2) continue; n++;

    if (d.x <= 0) continue; const s = (GLARE.x - Pp.x) / d.x, y = -d.y * s, z = Pp.z + d.z * s;           // its mirror ray up to the end wall

}
function updatePlayer(dt) {

    if (inPool(P.pos.x, P.pos.z)) { const dx = Math.min(P.pos.x - (POOL.x0 - .35), (POOL.x1 + .35) - P.pos.x), dz = Math.min(P.pos.z - (POOL.z0 - .35), (POOL.z1 + .35) - P.pos.z);
      if (dx < dz) P.pos.x = P.pos.x < 0 ? POOL.x0 - .35 : POOL.x1 + .35; else P.pos.z = P.pos.z < 0 ? POOL.z0 - .35 : POOL.z1 + .35; }

  camera.position.set(P.pos.x, P.eyeY + bob, P.pos.z + fz);
  camera.rotation.set(P.pitch, P.yaw, 0);
  const h = $('#hint');
  h.innerHTML = [P.mode === 'seat' ? T('h_seat') : P.mode === 'stand' ? T('h_stand') : '', P.mode === 'deck' ? (P.pos.distanceTo(new V3(CHAIR.x, 0, CHAIR.z)) < 1.6 ? T('h_up') : '') : T('h_down'), T('h_whistle')].filter(Boolean).map(x => `<span>${x}</span>`).join('');
}

/* =====================================================================
   10. AUDIO (module aq01/audio.js; silent until it is there)
   ===================================================================== */
let AUDIO = null, AUMOD = null;
if (!params.has('mute')) try { AUMOD = await import('./aq01/audio.js'); } catch (e) { console.warn('audio.js not ready', e.message); }
function startAudio() {
  if (AUDIO || !AUMOD || params.has('mute')) return;
  try { const ctx = new (window.AudioContext || window.webkitAudioContext)(); AUDIO = AUMOD.createHallAudio(ctx); AUDIO.startAmbience(); AUDIO.setCrowd(.7); } catch (e) { console.warn('audio failed', e); AUDIO = null; }
}

/* =====================================================================
   11. END OF PHASE 1: your timeline
   ===================================================================== */
function fmt(s) { if (s == null) return '—'; const sign = s < 0 ? '−' : '+'; s = Math.abs(s); return `${sign}${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`; }
function endPhase1(forced) {
  if (S.ended) return; S.ended = true; S.running = false; document.exitPointerLock?.();
  const lg = S.log, ar = LANG === 'ar';
  const sig = lg.signal, look = GZ.firstLook;
  const rows = [
    [ar ? 'ريان يغوص تحت السطح' : 'Rayan slips under', fmt(0)],
    [ar ? 'أول نظرة منك إلى قاع الحارة ٤' : 'You first look at lane 4', fmt(look) + (look != null && GZ.firstGlare > .3 ? (ar ? '  (والوهج يغطّيه)' : '  (the glare over him)') : '')],
    [ar ? 'تنبيه الطفل عمر' : "Omar's alert", lg.omarAlert != null ? fmt(lg.omarAlert) : (ar ? 'لم يحدث' : 'did not happen')],
    [ar ? 'صفّارتك وإشارتك' : 'Your whistle and signal', sig != null ? fmt(sig) : (ar ? 'لم تُطلق' : 'none')],
    [ar ? 'انطلاق التصفية الرابعة فوقه' : 'Heat 4 dived in over him', lg.heat4Started != null ? (ar ? 'نعم' : 'yes') : (ar ? 'لا' : 'no')],
  ];

  if (sig != null && sig <= 25) { title = ar ? 'لاحظته وأوقفت كل شيء' : 'You saw him and stopped everything'; text = ar ? 'لم يكن هناك رذاذ ولا صوت. لاحظت الحارة الفارغة على السطح والشكل الساكن في القاع، وتصرّفت فورًا.' : 'There was no splash and no sound. You noticed the empty lane and the still shape on the bottom, and acted at once.'; }
  else if (sig != null && lg.heat4Started == null) { title = ar ? 'أوقفت البدء — لكن بعد تأخّر' : 'You stopped the start — after a delay'; text = ar ? 'كل عشر ثوانٍ من الانتظار هي عشر ثوانٍ إضافية تحت الماء. علامة واحدة تكفي للتصرّف: حارة فارغة، أو شكل ساكن، أو طفل يشير.' : 'Every 10 seconds of waiting is 10 more seconds underwater. One sign is enough to act on: an empty lane, a still shape, a child pointing.'; }
  else { title = ar ? 'لم يُلاحَظ في الوقت' : 'Not noticed in time'; text = ar ? 'انطلق السباق التالي فوقه. بعد النهاية مباشرة يتّجه انتباه الجميع إلى النتائج والانطلاقة التالية؛ واصل المسح حتى يخرج آخر سبّاح.' : 'The next race started over him. Right after a finish everyone turns to the results and the next start; keep scanning until every swimmer is out.'; }
  $('#endTitle').textContent = title; $('#endText').textContent = text;
  $('#endTl').innerHTML = rows.map(([a, b]) => `<span>${a}</span><span class="t">${b}</span>`).join('');
  $('#end').classList.remove('hide');
  window.__aqEnd = { signal: sig, firstLook: look, heat4Started: lg.heat4Started != null, forced: !!forced };
}
$('#btnAgain').onclick = () => location.reload();

/* =====================================================================
   12. START, DEMO, LOOP
   ===================================================================== */
const DEMO = { on: false };
function begin(demo) {
  $('#menu').classList.add('hide'); startAudio();
  if (demo) { DEMO.on = true; $('#brief').classList.add('hide'); go(); return; }
  $('#brief').classList.remove('hide');
}
function go() { $('#brief').classList.add('hide'); S.running = true; S.phase = 'play'; $('#hint').classList.remove('hide'); if (!DEMO.on) canvas.requestPointerLock?.(); }
$('#btnStart').onclick = () => begin(false);
$('#btnDemo').onclick = () => begin(true);
$('#btnBrief').onclick = go;
// the demo (and tests): ?auto=good (stand up, notice, whistle at T+6) | late (whistle only at the forced cue) | none
const AUTO = params.get('auto');
function demoUpdate(dt) {
  if (!(DEMO.on || AUTO)) return;
  const mode = AUTO || 'good';
  const lookAt = (x, y, z, rate = 3) => { const d = new V3(x, y, z).sub(camera.position); const yaw = Math.atan2(-d.x, -d.z), pitch = Math.atan2(d.y, Math.hypot(d.x, d.z)); let dy = yaw - P.yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy)); P.yaw += dy * Math.min(1, dt * rate); P.pitch += (pitch - P.pitch) * Math.min(1, dt * rate); };
  const tt = S.T0 == null ? null : S.t - S.T0;
  if (S.t < 15) lookAt(-12, 0, -2);
  else if (S.T0 == null) { const lead = S.heat3.reduce((a, s) => Math.max(a, s.x), -30); lookAt(Math.min(lead + 2, 24), 0, laneZ(3)); if (mode === 'good' && rayan.st === 'roll') P.mode = 'stand'; }
  else if (mode === 'good') { lookAt(rayan.x, -1.8, rayan.z, 4); if (tt > 6) whistle(); }
  else if (mode === 'late') { lookAt(POOL.x1 - 3, 0, laneZ(5)); if (S.log.forced != null && tt > 122) whistle(); }
}
const FREEZE = params.has('freeze');
let started = false;
function tick(dt, draw) {

  renderer.setRenderTarget(refrRT); renderer.setClearColor(0x0a2a35, 1); renderer.clear(); renderer.render(scene, camera);
  renderer.setRenderTarget(null); renderer.clippingPlanes = []; camera.layers.set(0); water.visible = true;
  renderer.setClearColor(0x000000, 1);
  renderer.render(scene, camera);
}
function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  const pr = renderer.getPixelRatio(); refrRT.setSize(Math.max(1, Math.floor(w * pr * .6)), Math.max(1, Math.floor(h * pr * .6)));
}
addEventListener('resize', resize); resize();
// the hall's reflection: capture once with the water hidden
water.visible = false; cubeCam.update(renderer, scene); water.visible = true;
const pmrem = new THREE.PMREMGenerator(renderer); scene.environment = pmrem.fromCubemap(cubeRT.texture).texture; scene.environmentIntensity = .45;
const clock = new THREE.Clock();
function loop() { requestAnimationFrame(loop); tick(FREEZE ? 0 : Math.min(clock.getDelta(), .05), true); }
loop();
if (params.has('play') || AUTO) { $('#menu').classList.add('hide'); startAudio(); DEMO.on = !!AUTO; go(); }
window.__aq = { S, P, camera, scene, rayan, GZ, O, glareCover, tick: (n, dt = 1 / 30) => { for (let i = 0; i < n; i++) tick(dt, false); }, render: () => tick(0, true), whistle };
document.body.dataset.state = 'ready';
</script>
