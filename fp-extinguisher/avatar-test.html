const _h2f = (() => { const t = new Float32Array(65536); for (let h = 0; h < 65536; h++) { const s = h & 0x8000 ? -1 : 1, e = (h >> 10) & 31, m = h & 1023; t[h] = s * (e === 0 ? m * 2 ** -24 : e === 31 ? (m ? NaN : Infinity) : (1 + m / 1024) * 2 ** (e - 15)); } return t; })();

  src.updateMatrixWorld(true);
  for (const p of pairs) {                                  // parents first (MAP order follows the hierarchy)
    _q.copy(wq(p.s)).multiply(_pq.copy(p.sRest).invert()).multiply(_cq.copy(p.C).invert()).multiply(p.tRest);   // source bone direction, carried onto the target's rest
    p.t.parent.getWorldQuaternion(_pq).invert(); p.t.quaternion.copy(_pq.multiply(_q));
    p.t.updateMatrixWorld(true);
  }
  // hips: vertical + small sway follow the mocap, scaled to her leg length; the walk stays on the spot
  const d = hipsS.getWorldPosition(_v).sub(hipRestS).multiplyScalar(hipScale);
  if (curDef?.walk) { d.x = 0; d.z = 0; }
  else { d.x = THREE.MathUtils.clamp(d.x, -.06, .06); d.z = THREE.MathUtils.clamp(d.z, -.06, .06); }
  const wp = hipRestT.clone().add(d); hipsT.parent.worldToLocal(wp); hipsT.position.copy(wp);
  proxy.updateMatrixWorld(true);
}

/* ---------------- her head: looks at you, glances left/right the way people do ----------------
   Target = you (the camera). Every few seconds she glances away to one side, then comes back to you — or straight back
   to you as soon as you move. The turn is shared ~40% neck / 60% head, starts quick and lands softly (critically damped),
   tilts a little into the turn and dips slightly while moving, plus a slow breathing drift. */
const PB = n => pairs.find(p => p.t === tBones[n]);
const headB = tBones.Head, neckB = tBones.Neck, chestB = tBones.Spine2;
const headRest = PB('Head').tRest.clone(), neckRest = PB('Neck').tRest.clone(), chestRest = PB('Spine2').tRest.clone();
const LOOK_W = { m_idle_look_around_01: .25 };                 // that clip turns her head by itself
const FORCE = params.get('gaze');                               // screenshots: ?gaze=you | <yaw radians>
const gaze = { y: 0, p: 0, vy: 0, vp: 0, goalY: 0, goalP: 0, pendY: 0, pendP: 0, react: 0, mode: 'you', t: 0, next: 3 + Math.random() * 3, gy: 0, gp: 0, w: 0, lastCam: camera.position.clone() };
const P0 = +(params.get('p0') ?? .07);                            // her neutral head was a little chin-up
const _B = new Q4(), _Bi = new Q4(), _d = new V3(), _hp = new V3(), _R = new Q4(), _Rn = new Q4(), _e = new THREE.Euler(0, 0, 0, 'YXZ'), _w1 = new Q4(), _w2 = new Q4(), _pw = new Q4();
function spring(x, v, target, w, dt) { const a = w * w * (target - x) - 2 * w * v; v += a * dt; return [x + v * dt, v]; }
function lookUpdate(dt) {
  if (params.has('nolook')) return;
  const g = gaze; g.t += dt;
  _B.copy(wq(chestB)).multiply(_Bi.copy(chestRest).invert());                       // how her chest has turned since rest
  headB.getWorldPosition(_hp);
  _d.copy(camera.position).sub(_hp).applyQuaternion(_Bi.copy(_B).invert()).normalize();   // you, seen from her chest (z = her front)
  const youY = Math.atan2(_d.x, _d.z), youP = -Math.asin(THREE.MathUtils.clamp(_d.y, -1, 1));
  if (camera.position.distanceTo(g.lastCam) > .03) {                                 // you moved: she comes back to you
    if (g.mode !== 'you') { g.mode = 'you'; g.react = 0; }
    g.next = Math.max(g.next, g.t + 2.5); g.lastCam.copy(camera.position);
  }
  if (g.t > g.next) {
    if (g.mode === 'you') { const s = Math.random() < .5 ? -1 : 1; g.mode = 'away'; g.gy = s * (.4 + Math.random() * .45); g.gp = (Math.random() - .3) * .16; g.next = g.t + .9 + Math.random() * 1.6; }
    else { g.mode = 'you'; g.next = g.t + 3.5 + Math.random() * 4; }
    g.react = 0;
  }
  // where her head wants to point. A person does not track you continuously: the head jumps to you in steps,
  // after a short reaction delay, only once you have moved more than ~7°; the eyes would cover the rest.
  let wy, wp;
  if (FORCE !== null && FORCE !== 'you') { wy = +FORCE; wp = 0; }
  else if (g.mode === 'you' || FORCE === 'you') { wy = Math.abs(youY) > 1.45 ? Math.sign(youY) * 1.0 : youY * .95; wp = youP * .6; }
  else { wy = g.gy; wp = g.gp; }
  wy = THREE.MathUtils.clamp(wy, -1.05, 1.05); wp = THREE.MathUtils.clamp(wp, -.25, .3);
  if (FORCE !== null) { g.goalY = wy; g.goalP = wp; }
  else if (g.react > 0) { if (g.t >= g.react) { g.goalY = g.pendY; g.goalP = g.pendP; g.react = 0; } }
  else if (Math.abs(wy - g.goalY) > .12 || Math.abs(wp - g.goalP) > .1) { g.pendY = wy; g.pendP = wp; g.react = g.t + .12 + Math.random() * .12; }
  const om = g.mode === 'away' ? 8 : 6.5;                                            // a 45° turn takes ~0.45 s, starts quick, lands soft
  [g.y, g.vy] = spring(g.y, g.vy, g.goalY, om, dt); [g.p, g.vp] = spring(g.p, g.vp, g.goalP, om, dt);
  if (FORCE !== null) { g.y = g.goalY; g.p = g.goalP; g.vy = g.vp = 0; }
  const tt = g.t;
  const yaw = g.y + Math.sin(tt * .29) * .015 + Math.sin(tt * .83 + 2) * .006;
  const pitch = P0 + g.p + Math.sin(tt * 1.55) * .008 + Math.min(.04, Math.abs(g.vy) * .02);   // level chin + breathing nod + dip while turning
  const roll = -g.y * .06 + Math.sin(tt * .41 + 1) * .01;                                          // slight tilt into the turn
  const wT = (LOOK_W[curDef?.id] ?? .9) * +(params.get('look') ?? 1);
  g.w = FORCE !== null ? wT : g.w + (wT - g.w) * Math.min(1, dt * 3);
  // big turns bring the chest along a little (people do not turn the neck alone past ~40°)
  const chestYaw = Math.sign(yaw) * Math.max(0, Math.abs(yaw) - .45) * .35 * g.w;
  if (chestYaw) {
    _e.set(0, chestYaw, 0); _Rn.setFromEuler(_e); _w1.copy(_B).multiply(_Rn).multiply(chestRest);
    chestB.parent.getWorldQuaternion(_pw).invert(); chestB.quaternion.copy(_pw.multiply(_w1)); chestB.updateMatrixWorld(true);
  }
  // neck ~40%, head the rest (in her chest's frame as the animation left it)
  _e.set(pitch * .4, yaw * .4, roll * .4); _Rn.setFromEuler(_e);
  _e.set(pitch, yaw, roll); _R.setFromEuler(_e);
  _w1.copy(_B).multiply(_Rn).multiply(neckRest); _w2.copy(wq(neckB)).slerp(_w1, g.w);
  neckB.parent.getWorldQuaternion(_pw).invert(); neckB.quaternion.copy(_pw.multiply(_w2)); neckB.updateMatrixWorld(true);
  _w1.copy(_B).multiply(_R).multiply(headRest); _w2.copy(wq(headB)).slerp(_w1, g.w);
  headB.parent.getWorldQuaternion(_pw).invert(); headB.quaternion.copy(_pw.multiply(_w2)); headB.updateMatrixWorld(true);
}


// bone index remap: Blender bone order (figure.json) -> three.js skeleton order
const remap = meta0.bones.map(n => skinned.skeleton.bones.findIndex(b => b.name.replace(/[^A-Za-z0-9]/g, '') === n.replace(/[^A-Za-z0-9]/g, '')));
console.log('unmapped bones', meta0.bones.filter((n, i) => remap[i] < 0));
skinned.skeleton.computeBoneTexture();
const fig = await loadFigure(FIG, skinned, remap.map(i => Math.max(i, 0)));
fig.material.uniforms.boneTexture.value = skinned.skeleton.boneTexture;
scene.add(fig);

// UI
const ui = document.getElementById('ui');
for (const c of CLIPS) { const b = document.createElement('button'); b.textContent = c.label; b.dataset.id = c.id; b.onclick = () => play(c); ui.appendChild(b); }
await play(CLIPS.find(c => c.id === params.get('clip')) || CLIPS[0]);
info.textContent = `${fig.userData.N.toLocaleString()} نقطة · الوش: المسح الأصلي · الجسم: LHM (للتجربة فقط)`;

const clock = new THREE.Clock(); let frame = 0;
const warm = +(params.get('warm') || 0), at = params.has('t') ? +params.get('t') : null;
if (at !== null) mixer.update(at);
function tick() {
  const dt = Math.min(clock.getDelta(), .05);
  if (at === null) mixer.update(dt);
  retarget(); lookUpdate(dt); skinned.skeleton.update();
  fig.matrix.copy(skinned.matrixWorld); fig.matrixWorld.copy(skinned.matrixWorld);
  fig.material.uniforms.uViewport.value.set(renderer.domElement.width, renderer.domElement.height);
  if (frame % 3 === 0) fig.userData.sort(camera);
  const hp = hipsT.getWorldPosition(_v); shadow.position.x = hp.x; shadow.position.z = hp.z;
  ctl.update(); renderer.render(scene, camera); frame++;
  if (warm && frame === warm) document.body.dataset.ready = '1';
  requestAnimationFrame(tick);
}
tick();
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
