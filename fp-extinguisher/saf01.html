<style>
:root{
  --acc:#ff5a1f; --ink:#f3efe8; --mute:#a39d93; --glass:rgba(14,15,18,.6); --line:rgba(255,255,255,.13);
  --ok:#3ccf7e; --warn:#ffb020; --bad:#ff4d3a;
  --mono:'JetBrains Mono',ui-monospace,monospace; --sans:'Space Grotesk',system-ui,sans-serif; --ar:'IBM Plex Sans Arabic',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0d0d0f;color:var(--ink);font-family:var(--ar)}
body.en{font-family:var(--sans)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:8px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.k{font:600 10px var(--mono);letter-spacing:.16em;color:var(--mute);text-transform:uppercase}
body.ar .k{font:600 12px var(--ar);letter-spacing:0}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;transition:opacity .3s}
body.menu #hud{opacity:.2}
#obj{position:fixed;top:16px;left:16px;padding:12px 14px;width:300px}
#obj h1{font:700 17px var(--sans);margin-top:3px}
body.ar #obj h1{font:700 18px var(--ar)}
#objStep{margin-top:9px;font-size:14px;line-height:1.5;display:flex;gap:9px;align-items:flex-start}
#objStep::before{content:'';width:8px;height:8px;margin-top:7px;border-radius:2px;background:var(--acc);flex:none}
#stats{position:fixed;top:16px;right:16px;padding:12px 14px;width:236px;display:grid;gap:10px}
#timer{font:700 30px var(--mono);letter-spacing:.02em;direction:ltr;text-align:start}
#timer.low{color:var(--bad)}
.meter .row{display:flex;justify-content:space-between;align-items:baseline}
.meter .v{font:600 11px var(--mono);direction:ltr}
.bar{height:5px;background:rgba(255,255,255,.1);border-radius:3px;margin-top:5px;overflow:hidden;direction:ltr}
.bar i{display:block;height:100%;width:50%;border-radius:3px;background:var(--acc)}
#bFire i{background:linear-gradient(90deg,#ffb020,#ff4d3a)}
#bCharge i{background:#e8e3da}
#bStress i{background:linear-gradient(90deg,#3ccf7e,#ffb020 55%,#ff4d3a)}
#pass{position:fixed;left:16px;bottom:16px;padding:10px 12px;width:300px}
#pass ol{list-style:none;display:flex;gap:6px;margin-top:7px;direction:ltr}
#pass li{flex:1;text-align:center;padding:6px 4px;border:1px solid var(--line);border-radius:5px}
#pass li b{display:block;font:700 15px var(--sans)}
#pass li span{display:block;font:500 11px var(--ar);color:var(--mute);margin-top:1px}
body.en #pass li span{font-family:var(--sans)}
#pass li.done{border-color:var(--ok);background:rgba(60,207,126,.13)}
#pass li.done b{color:var(--ok)}
#prompt{position:fixed;left:50%;bottom:132px;transform:translateX(-50%);padding:9px 14px;display:flex;gap:10px;align-items:center;font-size:14px;opacity:0;transition:opacity .2s;white-space:nowrap}
#prompt.on{opacity:1}
.kc{font:700 11px var(--mono);min-width:26px;height:24px;padding:0 7px;display:inline-grid;place-items:center;border:1px solid rgba(255,255,255,.45);border-bottom-width:3px;border-radius:5px;color:#fff;background:rgba(255,255,255,.07);direction:ltr}
#log{position:fixed;right:16px;bottom:16px;padding:10px 12px;width:300px}
#log ul{list-style:none;margin-top:6px;display:grid;gap:4px;font:500 11px var(--mono);direction:ltr}
#log li{display:grid;grid-template-columns:42px auto 1fr;gap:8px;align-items:baseline}
#log li em{font-style:normal;color:var(--mute)}
#log li b{color:var(--acc);font-weight:700}
#log li span{color:var(--mute);font:500 11px var(--ar);text-align:end}
body.en #log li span{font-family:var(--sans)}
#log li.warn b{color:var(--warn)}
#xh{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.5);opacity:.85;transition:all .15s}
#xh.aim{width:24px;height:24px;margin:-12px 0 0 -12px;background:none;border:2px solid var(--ok);box-shadow:none}
#hints{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);padding:7px 12px;font-size:12px;color:#e6e0d6;white-space:nowrap;display:flex;gap:6px;align-items:center}
#hints .kc{min-width:20px;height:20px;font-size:10px;padding:0 5px}
#hints i{font-style:normal;color:var(--mute);margin:0 2px}
#gest{position:fixed;left:50%;bottom:58px;transform:translateX(-50%);display:flex;gap:5px;direction:ltr}
#gest span{padding:4px 8px;border:1px solid var(--line);border-radius:5px;background:var(--glass);font-size:11.5px;color:var(--mute)}
#gest span.on{border-color:var(--acc);color:#fff;background:rgba(255,90,31,.25)}
#gest b{font:700 10px var(--mono);margin-inline-end:5px;color:#fff}
@media (max-width:1200px){ #hints{display:none} }
#toast{position:fixed;left:50%;top:22%;transform:translate(-50%,-10px);padding:10px 16px;font-size:15px;font-weight:600;opacity:0;transition:all .25s;border-color:rgba(255,176,32,.5)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#heat{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(255,80,10,.6) 100%)}
#smokeV{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;background:radial-gradient(ellipse at center,rgba(30,28,26,.15) 20%,rgba(18,17,16,.92) 100%)}
#demoTag{position:fixed;top:16px;left:50%;transform:translateX(-50%);padding:6px 12px;font:700 11px var(--mono);letter-spacing:.2em;color:var(--acc);display:none}
body.demo #demoTag{display:block}
/* overlay */
.ov{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:rgba(8,8,10,.74);backdrop-filter:blur(4px)}
.ov.hide{display:none}
.card{width:min(600px,92vw);padding:22px 24px;max-height:92vh;overflow:auto}
.card h2{font:700 26px var(--ar);margin:4px 0 6px}
body.en .card h2{font-family:var(--sans)}
.card p{color:#d8d2c8;line-height:1.7;font-size:14px}
.ctrls{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:7px 14px;margin:14px 0;font-size:13.5px;align-items:center}
.ctrls .kc{justify-self:start}
.opts{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:14px 0 4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;direction:ltr}
.seg button{padding:7px 12px;font:600 12px var(--mono)}
.seg button.ar{font-family:var(--ar);font-size:13px}
.seg button.on{background:#f3efe8;color:#111}
.btns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{padding:11px 18px;border-radius:6px;background:var(--acc);color:#fff;font-weight:700;font-size:14px}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.dev{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--mute);margin-top:10px}
.dev input[type=range]{width:160px;accent-color:var(--acc)}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 4px}
.metrics div{padding:10px 12px;border:1px solid var(--line);border-radius:6px}
.metrics b{display:block;font:700 20px var(--mono);margin-top:4px;direction:ltr;text-align:start}
.win{color:var(--ok)} .lose{color:var(--bad)}
.note{font-size:12px;color:var(--mute);margin-top:10px}
@media (max-width:820px){ #log,#pass{display:none} #obj{width:auto;right:16px} #stats{display:none} }
/* SAF-01: subtitles, choices, the look card, endings */
#dlg{position:fixed;left:16px;top:200px;bottom:80px;width:min(340px,calc(50vw - 352px));display:flex;flex-direction:column;justify-content:flex-end;gap:6px;overflow:hidden;opacity:0;transition:opacity .4s;pointer-events:none;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 70px);mask-image:linear-gradient(to bottom,transparent 0,#000 70px)}
#dlg.on{opacity:1} #dlg.idle{opacity:.6}
#dlg .ln{flex:none;align-self:flex-start;max-width:90%;padding:7px 11px 8px;border-radius:13px;background:rgba(18,20,24,.74);border:1px solid rgba(255,255,255,.09);backdrop-filter:blur(6px);font-size:14.5px;line-height:1.55;box-shadow:0 2px 10px rgba(0,0,0,.25)}
#dlg .ln[data-who=you]{align-self:flex-end;background:rgba(30,58,96,.8);border-color:rgba(127,200,255,.18)}
#dlg .ln[data-who=book]{align-self:flex-end;background:rgba(58,48,28,.78);border-color:rgba(208,192,255,.14);font-size:13.5px}
#dlg .ln[data-who=look]{align-self:center;background:rgba(90,30,20,.7)}
#dlg .ln.cont{margin-top:-3px} #dlg .ln.cont b{display:none}
#dlg .ln[data-live]{border-color:rgba(255,255,255,.28)}
#dlg .rest{opacity:.38}
@media (max-width:960px){ #dlg{display:none} }
#dlg b,#choices .q b,#look b{display:block;font:700 11px var(--mono);letter-spacing:.14em;color:var(--acc);text-transform:uppercase;margin-bottom:2px}
body.ar #dlg b,body.ar #choices .q b,body.ar #look b{font:700 13px var(--ar);letter-spacing:0}
#dlg .ln[data-who=you] b{color:#7fc8ff} #dlg .ln[data-who=look] b{color:var(--mute)}
#dlg .ln[data-who=fathy] b{color:#a8dc8c} #dlg .ln[data-who=mahmoud] b{color:#f0a8d0}
#choices{position:fixed;left:50%;bottom:118px;transform:translateX(-50%);width:min(640px,92vw);display:none;flex-direction:column;gap:6px;pointer-events:auto;z-index:6}
#choices.on{display:flex}
#choices .q{padding:9px 14px;font-size:15.5px;line-height:1.55}
#choices button{display:flex;gap:10px;align-items:center;padding:9px 12px;text-align:start;font-size:14.5px;line-height:1.45}
#choices button:hover{border-color:var(--acc)} #choices button .kc{flex:none}
#look{position:fixed;left:50%;top:15%;transform:translateX(-50%);width:min(520px,90vw);padding:11px 15px;font-size:14.5px;line-height:1.6;opacity:0;transition:opacity .2s;border-color:rgba(255,255,255,.25)}
#look.on{opacity:1}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:8;transition:opacity 1.4s}
#result .card{width:min(780px,94vw);scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.22) transparent}
.dl{margin:10px 0 4px} .dl ul{list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:5px;margin-top:6px}
.dl li{padding:5px 10px;border-radius:6px;border:1px solid var(--line);font-size:13px;line-height:1.45}
.dl li.good{border-color:rgba(60,207,126,.55)} .dl li.bad{border-color:rgba(255,176,32,.6)}
.warn{color:var(--warn)} #rLesson{margin-top:10px;color:#f0ebe2} #rLimits{line-height:1.6}
</style>

/* =====================================================================
   13. EMOTION (stress 0–1: fire proximity + smoke + time left)
   ===================================================================== */
function updateEmotion(dt) {
  const dist = Math.hypot(camera.position.x - F.x, camera.position.z - F.z);
  const alive = fire.out ? 0 : clamp(fire.health * 1.4, 0, 1);
  const prox = (1 - sstep(1.3, 7.5, dist)) * alive;
  const timeP = sstep(.45, 1, sim.t / LIMIT);
  let raw = clamp(.6 * prox + .35 * (smokeLevel * .5 + emo.smokeHead) + .3 * timeP, 0, 1);
  if ($('#devOn').checked) raw = +$('#devStress').value;
  if (params.has('stress')) raw = +params.get('stress');
  emo.stressRaw = raw;
  emo.stress += (raw - emo.stress) * Math.min(1, dt * 1.6);
  emo.sweat += (emo.stress - emo.sweat) * Math.min(1, dt * .25);
  emo.soot = Math.min(.85, emo.soot + dt * (emo.smokeHead * .02 + (dist < 2.2 ? .012 * alive : 0)));
  const ret = (1 - sstep(1.05, 1.75, dist)) * alive;
  if (ret > .5 && emo.retract <= .5) toast('t_hot');
  emo.retract += (ret - emo.retract) * Math.min(1, dt * 6);
  emo.heat = (1 - sstep(1.0, 2.6, dist)) * alive;
  // one skin control: sweat sheen + soot
  if (RB.ready) for (const m of [RB.std, RB.phys]) { m.color.copy(m.userData.skinBase || SKIN_WHITE).lerp(SOOT_TINT, emo.soot * .6); m.roughness = .58 - .26 * emo.sweat; }
  if (RB.ready) RB.phys.sheen = .2 + .4 * emo.sweat;
  if (RB.ready && RB.kStd) for (const [m, c] of [[RB.kStd, KNIT_C], [RB.kPhys, KNIT_C], [RB.cStd, COAT_C], [RB.cPhys, COAT_C]]) m.color.copy(c).lerp(DUST, emo.soot * .35);   // ash dust on black gloves
  for (const m of [skinStd, skinPhys]) {
    m.color.copy(SKIN).lerp(SOOT, emo.soot * .55);
    m.roughness = .6 - .32 * emo.sweat;
  }
  skinPhys.sheen = .25 + .55 * emo.sweat;
  if (dist < 1.25 && H.spraying && !stats.closeWarned) { stats.closeWarned = true; toast('t_close'); Engine.dispatch('too_close', { distance: +dist.toFixed(2) }); }
  if (dist > 1.6) stats.closeWarned = false;
}

/* =====================================================================
   14. PHYSICS (pin + dropped extinguisher) and HOSE
   ===================================================================== */
function updatePhysics(dt) {
  for (let i = dropped.length - 1; i >= 0; i--) {
    const b = dropped[i];
    b.vel.y -= 9.8 * dt;
    b.obj.position.addScaledVector(b.vel, dt);
    if (b.kind === 'pin') { b.obj.rotation.x += b.spin.x * dt; b.obj.rotation.y += b.spin.y * dt; b.obj.rotation.z += b.spin.z * dt; }
    const floor = b.kind === 'pin' ? .006 : 0;
    if (b.obj.position.y <= floor) {
      b.obj.position.y = floor; b.vel.y *= -.3; b.vel.x *= .55; b.vel.z *= .55; b.spin.multiplyScalar(.5);
      if (Math.abs(b.vel.y) < .25) { b.vel.set(0, 0, 0); if (b.kind === 'pin') b.obj.rotation.set(Math.PI / 2, b.obj.rotation.y, 0); dropped.splice(i, 1); }
    }
    b.obj.position.x = clamp(b.obj.position.x, -RW / 2 + .1, RW / 2 - .1);
    b.obj.position.z = clamp(b.obj.position.z, -RD / 2 + .1, RD / 2 - .1);
  }
}
const HOSE_O = new V3(-.05, .548, 0), HOSE_P1 = new V3(-.085, .53, 0);
let hoseSig = '';
function updateHose() {
  ext.updateMatrixWorld(true);
  const n = ext.worldToLocal(EX.tail.getWorldPosition(new V3()));
  const sig = n.x.toFixed(3) + n.y.toFixed(3) + n.z.toFixed(3);
  if (sig === hoseSig) return; hoseSig = sig;
  const mid = HOSE_P1.clone().lerp(n, .5); mid.y -= .06 + .12 * Math.min(1, HOSE_P1.distanceTo(n) * 2);
  const curve = new THREE.CatmullRomCurve3([HOSE_O, HOSE_P1, mid, n]);
  EX.hose.geometry.dispose();
  EX.hose.geometry = new THREE.TubeGeometry(curve, 28, .0085, 7);
}

function dlgTick(dt) {

const clock = new THREE.Clock();
function tick(dt, draw) {
  sim.frame++;
  if (sim.running && !sim.ended || sim.ended) {
    const live = sim.running && !sim.ended;
    if (live) { sim.t += dt; updateDemo(dt); }
    updatePlayer(live ? dt : 0);
    handsRoot.position.copy(camera.position); handsRoot.quaternion.copy(camera.quaternion); handsRoot.updateMatrixWorld(true);
    if (live) updatePin(dt);
    updateHands(dt);
    holdUpright();
    handsScene.updateMatrixWorld(true);
    updateFire(live ? dt : dt * .5);
    if (live && sim.frame % Q().emoEvery === 0) updateEmotion(dt * Q().emoEvery);
    updatePhysics(dt);
    updateHose();
    if (live) updatePassAim(dt);
    EX.needle.rotation.z = lerp(-1.3, .55, H.charge);
    if (live) updateSAF(dt);
  } else {
    // menu: idle camera and live fire in the background
    updatePlayer(0);
    handsRoot.position.copy(camera.position); handsRoot.quaternion.copy(camera.quaternion); handsRoot.updateMatrixWorld(true);
    updateHands(dt); handsScene.updateMatrixWorld(true); updateFire(dt * .6); updateHose();
  }
  updateWorkers(dt);

  sunH.castShadow = Q().shadows;

const post = (() => {

  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uGrain: { value: .06 }, uVig: { value: .5 }, uAspect: { value: 1 } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }',
    fragmentShader: `uniform float uTime, uGrain, uVig, uAspect; varying vec2 vUv;
      float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
      void main(){
        vec2 c = (vUv - .5) * vec2(uAspect, 1.); float r2 = dot(c, c);

  const resize = () => { mat.uniforms.uAspect.value = innerWidth / innerHeight; };

})();
const FREEZE = params.has('freeze');                               // test hook: stop the clock (screenshots of one moment)
const PERF = params.has('perf') ? { t0: 0, frames: [], js: [], fb: [], sort: 0 } : null;   // test hook: real-GPU timing (?perf)
function loop(now) {

  const a = performance.now(); tick(FREEZE ? 0 : Math.min(clock.getDelta(), .05), true);
  if (PERF && now) {

    PERF.frames.push(now); PERF.js.push(performance.now() - a);

      const q = (A, p) => +(A[Math.floor(A.length * p)] || 0).toFixed(1), avg = A => +(A.reduce((s, v) => s + v, 0) / Math.max(A.length, 1)).toFixed(1);
